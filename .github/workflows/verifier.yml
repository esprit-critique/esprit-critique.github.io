# Contrôles du site : à chaque pull request, et avant chaque publication (appelé par publier.yml).
# Les mêmes commandes tournent en local : tests/lancer.sh (voir README, « Tests »).
name: Vérifier

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  syntaxe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions désignées par l'empreinte de leur commit (une étiquette peut être déplacée) ; version en commentaire
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntaxe des scripts du site
        run: for f in static/*.js static/en/*.js; do node --check "$f" || exit 1; done
      - name: Noms globaux en double
        run: python3 tests/noms_globaux.py
      - name: Version anglaise complète
        run: python3 tests/en/controle.py
      - name: Contrôle statique de sécurité
        run: python3 tests/securite.py
      - name: Verdict des rapports
        run: python3 tests/verdict.py

  # Bancs indépendants de la taille d'écran : Grand test hors navigateur (Node.js), Playwright, données aléatoires
  hors-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: tests/lancer.sh calculs familles banques recherche aleatoire progression
        env:
          CONFIGS: 390 clair
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-hors-configuration
          path: tests/rapports/

  # Bancs dans Chrome sans fenêtre, une configuration par tâche (en parallèle)
  bancs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config: ["390 clair", "390 sombre", "1280 clair", "1280 sombre"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/lancer.sh affichage ateliers test niveaux items csp grand hors-ligne
        env:
          CONFIGS: ${{ matrix.config }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-${{ strategy.job-index }}
          path: tests/rapports/
