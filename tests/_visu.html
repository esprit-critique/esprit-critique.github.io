<!DOCTYPE html>
<meta charset="UTF-8">
<style>body { margin: 0 } iframe { border: 0; width: var(--l, 390px); height: 100vh; display: block }</style>
<iframe id="f" src="/_site.html#accueil"></iframe>
<script>if (innerWidth > 700) document.documentElement.style.setProperty("--l", "100%");</script>
<script>
// Met l'application dans un état donné (#scenario), pour une capture d'écran.
const f = document.getElementById("f");
const pause = ms => new Promise(r => setTimeout(r, ms));
let lance = false;
f.onload = async () => {
  if (lance) return;
  lance = true;
  let w = f.contentWindow, d = f.contentDocument;
  const aller = async h => { w.location.hash = h; await pause(200); };
  const vue = () => d.querySelector("main > section:not([hidden])");
  const choix = k => [...vue().querySelectorAll(".choix:not(:disabled)")][k].click();
  const valider = () => vue().querySelector("[data-valider]:not(:disabled)").click();
  const suivant = () => vue().querySelector("[data-suivant]").click();
  const curseur = v => { const c = vue().querySelector("input.curseur:not(:disabled)"); c.value = v; c.dispatchEvent(new w.Event("input")); };
  const scenario = decodeURIComponent(location.hash.slice(1));
  if (!scenario.startsWith("garder")) w.localStorage.clear();
  // Quelques parties déjà jouées, pour voir badges et parcours
  if (scenario === "ateliers-joues" || scenario === "vf-bilan") {
    w.localStorage.setItem("resultatsAteliers", JSON.stringify({ monde: { n: 3, record: 8, sur: 10, historique: [5, 7, 8], jour: 1 }, pays: { n: 1, record: 6, sur: 10, historique: [6], jour: 1 }, illusion: { n: 2, historique: [] } }));
    w.localStorage.setItem("confiance", JSON.stringify({ 50: [6, 3], 70: [14, 9], 90: [20, 14], 99: [8, 7] }));
  }
  // Progression simulée : notions à divers niveaux, ateliers joués, points sur dix semaines, maîtrise passée
  const remplirProgression = async () => {
    const auj = w.eval("aujourdHui()"), cles = [...w.eval("INDEX").keys()];
    const memoire = {};
    cles.forEach((c, k) => { if (k % 3) memoire[c] = { b: 1 + (k % 5), d: auj + 2, n: 3 + k % 4, j: 2 + k % 3 }; });
    const res = {};
    [["monde", 8, 10, 2], ["pays", 7, 10, 1], ["vrai-faux", 9, 12, 3], ["hasard", 6, 10, 1], ["crt", 2, 3, 1], ["logique", 7, 8, 2], ["debat-truque", 9, 10, 2], ["graphiques", 4, 6, 1], ["reparer", 5, 6, 2]].forEach(([id, sc, sur, L]) => {
      res[id] = { n: 5, record: sc, sur, historique: [sc - 1, sc, sc, sc - 1, sc], jour: auj, niveaux: { [L]: { n: 5, record: sc, sur, historique: [sc - 1, sc, sc, sc - 1, sc] } } };
    });
    const jours = {}, mjours = {};
    for (let k = 0; k < 70; k++) { if (k % 4) jours[auj - k] = 20 + (k * 37) % 90; mjours[auj - 69 + k] = [Math.round(30 + k * 2.6), 300, 200, 150, 260, 220, 180]; }
    const st = w.localStorage;
    st.setItem("memoire", JSON.stringify(memoire));
    st.setItem("resultatsAteliers", JSON.stringify(res));
    st.setItem("confiance", JSON.stringify({ 50: [12, 7], 70: [15, 10], 90: [20, 16], 99: [6, 6] }));
    st.setItem("certitudes", JSON.stringify({ sur: [40, 35], plutot: [30, 20], hasard: [12, 5] }));
    st.setItem("activite", JSON.stringify(Object.keys(jours).map(Number).sort((a, b) => a - b)));
    st.setItem("lucidite", JSON.stringify({ total: 4210, jours, compteurs: {}, uniques: {}, journal: [], rattrapage: 1200, rattrapageVu: true }));
    st.setItem("maitrise", JSON.stringify({ jours: mjours, meilleure: 210, depuis: auj - 69, grade: 4 }));
    st.setItem("fichesLues", JSON.stringify(cles.slice(0, 40)));
    st.setItem("profil", JSON.stringify({ pseudo: "Hypatie" }));
    w.location.reload();
    await new Promise(r => { f.onload = r; });
    await pause(300);
    w = f.contentWindow; d = f.contentDocument;
  };

  const etapes = {
    "accueil": async () => { await aller("accueil"); },
    // Quiz après une mauvaise réponse (sans demande de certitude)
    "quiz-faux": async () => {
      w.localStorage.setItem("certitudeQuiz", "false");
      await aller("quiz/tout");
      const q = w.eval("quiz").serie[w.eval("quiz").index];
      vue().querySelectorAll(".choix")[q.options.findIndex(o => o !== q.fiche)].click();
    },
    // Les 39 schémas d'argument, rendus par schemaArgument (relecture des découpages, comme tests/formes.html)
    "formes": async () => {
      await aller("accueil");
      const zone = vue();
      zone.innerHTML = "";
      const carte = w.document.createElement("article");
      carte.className = "carte carte-fiche";
      w.eval("SOPHISMES").forEach(s => {
        const titre = w.document.createElement("p");
        titre.className = "consigne";
        titre.textContent = "S " + s.num + " · " + s.nom;
        const bloc = w.schemaArgument(s.forme);
        bloc.style.marginBottom = "20px";
        carte.append(titre, bloc);
      });
      zone.appendChild(carte);
    },
    "quiz-faux-verdict": async () => {
      w.localStorage.setItem("certitudeQuiz", "false");
      await aller("quiz/tout");
      const q = w.eval("quiz").serie[w.eval("quiz").index];
      vue().querySelectorAll(".choix")[q.options.findIndex(o => o !== q.fiche)].click();
      await pause(50);
      w.scrollTo(0, vue().querySelector(".cas").getBoundingClientRect().top + w.scrollY - 12);
    },
    "ateliers": async () => { await aller("ateliers"); },
    "ateliers-joues": async () => { await aller("ateliers"); },
    "monde": async () => { await aller("chiffres/monde"); choix(0); },
    "mortalite": async () => { await aller("chiffres/mortalite"); choix(0); },
    "pays": async () => { await aller("chiffres/pays"); choix(1); },
    "nord": async () => { await aller("chiffres/nord"); choix(0); },
    "grandeurs": async () => { await aller("chiffres/grandeurs"); curseur(600); },
    "grandeurs-retour": async () => { await aller("chiffres/grandeurs"); curseur(600); valider(); },
    "chronologie": async () => { await aller("chiffres/chronologie"); choix(0); },
    "vrai-faux": async () => { await aller("chiffres/vrai-faux"); choix(0); },
    "vrai-faux-retour": async () => { await aller("chiffres/vrai-faux"); choix(0); await pause(50); choix(2); },
    "vf-bilan": async () => { await aller("chiffres/vrai-faux"); for (let k = 0; k < 12; k++) { choix(k % 2); await pause(30); choix(k % 4); await pause(30); suivant(); await pause(40); } },
    "illusion": async () => { await aller("chiffres/illusion"); curseur(500); },
    "illusion-revele": async () => { await aller("chiffres/illusion"); curseur(560); valider(); },
    "ebbinghaus": async () => { await aller("chiffres/illusion"); curseur(560); valider(); await pause(50); suivant(); await pause(50); curseur(420); valider(); },
    "hasard": async () => { await aller("chiffres/hasard"); },
    "hasard-retour": async () => { await aller("chiffres/hasard"); choix(0); },
    "ecrire": async () => { await aller("chiffres/ecrire-hasard"); for (let k = 0; k < 17; k++) choix(k % 3 ? 0 : 1); },
    "ecrire-bilan": async () => { await aller("chiffres/ecrire-hasard"); for (let k = 0; k < 50; k++) choix(k % 2); },
    "correlation": async () => { await aller("chiffres/correlation"); curseur(40); valider(); },
    "graphiques": async () => { await aller("chiffres/graphiques"); },
    "graphiques-retour": async () => { await aller("chiffres/graphiques"); choix(0); },
    "intervalles": async () => { await aller("chiffres/intervalles"); },
    "ancre": async () => { await aller("chiffres/ancre"); },
    "crt": async () => { await aller("tests/crt"); },
    "wason": async () => { await aller("tests/wason"); },
    "monty": async () => { await aller("tests/monty-hall"); vue().querySelectorAll(".porte")[0].click(); },
    "monty10": async () => { await aller("tests/monty-hall"); vue().querySelectorAll(".segment a")[1].click(); await pause(30); vue().querySelectorAll(".porte")[3].click(); },
    "classiques": async () => { await aller("tests/classiques"); choix(0); await pause(40); if (vue().querySelector(".choix:not(:disabled)")) choix(1); },
    "depistage": async () => { await aller("tests/depistage"); const c = vue().querySelector("input.champ"); c.value = "50"; valider(); },
    "anniversaires": async () => { await aller("tests/anniversaires"); const c = vue().querySelector("input.champ"); c.value = "40"; valider(); await pause(30); [...vue().querySelectorAll(".simulation button")].pop().click(); },
    "pensee": async () => { await aller("tests/pensee"); choix(1); },
    // Dessins générés, choisis parmi les cas difficiles (dates longues, villes proches)
    "frises": async () => {
      await aller("chiffres/chronologie");
      const E = n => w.eval("EVENEMENTS").find(e => e.nom.includes(n));
      vue().innerHTML = "";
      [["Khéops", "Nintendo"], ["cinématographe", "frères Wright"], ["Nintendo", "rayons X"], ["Cléopâtre", "Vésuve"]].forEach(([a, b]) => {
        if (E(a) && E(b)) vue().appendChild(w.eval("frise")(E(a), E(b)));
      });
    },
    "planispheres": async () => {
      await aller("chiffres/nord");
      const V = w.eval("VILLES"), id = n => Object.keys(V).find(k => V[k][0] === n);
      vue().innerHTML = "";
      [["Madrid", "Londres", "ouest"], ["Atlanta", "Detroit", "ouest"], ["Le Caire", "Istanbul", "est"], ["Paris", "Oslo", "est"]].forEach(([a, b, sens]) => {
        if (id(a) && id(b)) vue().appendChild(w.eval("planisphere")([id(a), id(b)], sens));
      });
    },
    "echelles": async () => {
      await aller("chiffres/grandeurs");
      const carte = vue().querySelector(".carte") || vue();
      [[0, 9], [5, 14], [9, 18]].forEach(([a, b]) => carte.appendChild(w.eval("echelleLog")(a, b)));
    },
    "quiz-certitude": async () => { await aller("quiz/tout"); choix(1); },
    "proches": async () => { await aller("quiz/proches"); choix(0); await pause(30); vue().querySelectorAll(".certitude [data-niveau]")[0].click(); await pause(50); },
    "portrait-quiz": async () => {
      w.localStorage.setItem("duels", JSON.stringify({ "biais:ancrage": [3, 1], "sophismes:homme-de-paille": [2, 1], "biais:halo": [2, 2] }));
      w.localStorage.setItem("certitudes", JSON.stringify({ sur: [20, 17], plutot: [12, 8], hasard: [6, 2] }));
      w.localStorage.setItem("erreursSures", JSON.stringify([{ cle: "biais:cadrage", j: 1 }, { cle: "sophismes:post-hoc", j: 2 }]));
      await aller("portrait");
    },
    "accueil-agenda": async () => {
      w.eval("Object.assign(memoire, { 'biais:ancrage': { b: 1, d: 0, n: 1, j: 0 }, 'biais:halo': { b: 2, d: aujourdHui() + 3, n: 2, j: 2 } })");
      await aller("guide"); await aller("accueil");
      const carte = [...vue().querySelectorAll(".carte")].find(c => /Révisions/.test(c.textContent));
      if (carte) w.scrollTo(0, carte.getBoundingClientRect().top + w.scrollY - 10);
    },
    "debat": async () => { await aller("tests/debat-truque"); for (let k = 0; k < 2; k++) { choix(0); await pause(20); suivant(); await pause(20); } choix(1); await pause(30); if (vue().querySelector(".choix:not(:disabled)")) choix(0); await pause(50); },
    "debat-bilan": async () => { await aller("tests/debat-truque"); for (let k = 0; k < 12; k++) { choix(k % 3 ? 0 : 1); await pause(15); if (vue().querySelector(".choix:not(:disabled)")) choix(0); await pause(15); suivant(); await pause(20); } },
    "reparer": async () => { await aller("tests/reparer"); choix(2); await pause(50); },
    "reformuler": async () => { await aller("tests/reformuler"); choix(0); await pause(30); suivant(); await pause(30); choix(1); await pause(50); },
    "deux": async () => { await aller("tests/debat-a-deux"); const c = vue().querySelectorAll("input.champ"); c[0].value = "Alice"; c[1].value = "Bruno"; valider(); await pause(50); },
    "entrainement": async () => { await aller("sophismes/homme-de-paille"); const e = vue().querySelector(".entrainement"); e.querySelectorAll(".exercice").forEach(x => x.querySelector(".choix").click()); await pause(50); w.scrollTo(0, e.getBoundingClientRect().top + w.scrollY - 10); },
    "logique": async () => { await aller("tests/logique"); },
    "logique-bilan": async () => { await aller("tests/logique"); for (let k = 0; k < 40; k++) { const c = vue().querySelectorAll(".choix:not(:disabled)"); if (c.length) { c[k % 2].click(); await pause(10); continue; } const s = vue().querySelector("[data-suivant]"); if (!s || /Rejouer/.test(s.textContent)) break; s.click(); await pause(10); } },
    "moniteur": async () => { await aller("tests/moniteur"); for (let k = 0; k < 3; k++) { choix(k % 3); await pause(10); suivant(); await pause(10); } },
    "moniteur-bilan": async () => { await aller("tests/moniteur"); for (let k = 0; k < 24; k++) { choix(k % 3); await pause(10); suivant(); await pause(10); } const g = vue().querySelector(".figure-moniteur"); if (g) w.scrollTo(0, g.getBoundingClientRect().top + w.scrollY - 120); },
    "etudes": async () => { await aller("tests/etudes"); for (let k = 0; k < 3; k++) { choix(5); await pause(10); suivant(); await pause(10); } },
    "plusieurs": async () => { await aller("tests/plusieurs"); const c = vue().querySelectorAll("input.champ"); c[0].value = "Ana"; c[1].value = "Ben"; choix(0); await pause(20); for (let k = 0; k < 2; k++) { vue().querySelector("[data-suivant]").click(); await pause(10); choix(k); await pause(10); } },
    "carnet": async () => {
      const a = w.eval("aujourdHui()");
      w.localStorage.setItem("previsions", JSON.stringify([
        { id: "a", texte: "Je finirai le rapport de stage avant le 15", p: 70, echeance: a - 1, creee: a - 20, issue: null },
        { id: "b", texte: "Il pleuvra à Nice le 3", p: 30, echeance: a - 30, creee: a - 40, issue: "non", souvenir: 20 },
        { id: "c", texte: "Le colis arrivera avant samedi", p: 80, echeance: a - 25, creee: a - 30, issue: "oui", souvenir: 90 },
        { id: "d", texte: "J'aurai lu le livre d'ici la fin du mois", p: 60, echeance: a + 12, creee: a - 2, issue: null }]));
      await aller("chiffres/carnet");
      const t = vue().querySelector(".titre-carnet");
      if (t) w.scrollTo(0, t.getBoundingClientRect().top + w.scrollY - 10);
    },
    "niveau-auto": async () => { await aller("chiffres/monde"); },
    "niveau-3": async () => { w.localStorage.setItem("niveaux", JSON.stringify({ "vrai-faux": { niveau: 3, mode: "choisi" } })); await aller("chiffres/vrai-faux"); },
    "niveau-bilan": async () => { await aller("chiffres/monde"); for (let k = 0; k < 10; k++) { choix(0); await pause(10); suivant(); await pause(10); } },
    "portrait-niveaux": async () => {
      w.localStorage.setItem("resultatsAteliers", JSON.stringify({ monde: { n: 5, record: 9, sur: 10, historique: [6, 7, 9, 8, 9], niveaux: { 1: { n: 2, record: 7, sur: 10, historique: [6, 7] }, 2: { n: 2, record: 9, sur: 10, historique: [9, 8] }, 3: { n: 1, record: 9, sur: 10, historique: [9], reussites90: 1 } } },
        pays: { n: 4, record: 10, sur: 10, historique: [9, 10, 10, 9], niveaux: { 3: { n: 4, record: 10, sur: 10, historique: [9, 10, 10, 9], reussites90: 4 } } } }));
      w.localStorage.setItem("niveaux", JSON.stringify({ monde: { niveau: 2, mode: "auto" }, pays: { niveau: 3, mode: "auto" } }));
      await aller("portrait");
      const t = vue().querySelector(".tableau-niveaux");
      if (t) w.scrollTo(0, t.getBoundingClientRect().top + w.scrollY - 80);
    },
    "intervalles-niveau": async () => { await aller("chiffres/intervalles"); },
    "libre": async () => { await aller("quiz/libre"); const c = vue().querySelector(".reponse-libre input"); c.value = "ancr"; c.dispatchEvent(new w.Event("input")); c.focus(); },
    "defi": async () => { w.localStorage.removeItem("defiJour"); await aller("accueil"); [...vue().querySelectorAll(".defi-jour button")].find(b => /Relever/.test(b.textContent)).click(); await pause(20); vue().querySelector(".defi-jour .choix").click(); await pause(20); const c = vue().querySelector(".defi-jour"); w.scrollTo(0, c.getBoundingClientRect().top + w.scrollY - 10); },
    "calcul-vf": async () => { await aller("chiffres/vrai-faux"); for (let k = 0; k < 12; k++) { choix(k % 2); await pause(10); choix(2); await pause(10); suivant(); await pause(10); } const dd = vue().querySelector("details.calcul-detail"); dd.open = true; w.scrollTo(0, dd.getBoundingClientRect().top + w.scrollY - 10); },
    "classement-pays": async () => { w.localStorage.setItem("niveaux", JSON.stringify({ pays: { niveau: 3, mode: "choisi" } })); await aller("chiffres/pays"); },
    "classement-nord": async () => { w.localStorage.setItem("niveaux", JSON.stringify({ nord: { niveau: 3, mode: "choisi" } })); await aller("chiffres/nord"); vue().querySelector("[data-valider]").click(); await pause(30); const r = vue().querySelector(".retour-quiz"); w.scrollTo(0, r.getBoundingClientRect().top + w.scrollY - 10); },
    "fourchettes-3": async () => { w.localStorage.setItem("niveaux", JSON.stringify({ intervalles: { niveau: 3, mode: "choisi" } })); await aller("chiffres/intervalles"); },
    "fermi": async () => { w.localStorage.setItem("niveaux", JSON.stringify({ grandeurs: { niveau: 3, mode: "choisi" } })); await aller("chiffres/grandeurs"); curseur(450); valider(); await pause(20); suivant(); await pause(20); const c = vue().querySelectorAll("input.champ"); c.forEach((x, k) => { x.value = ["70", "500000", "80", "8000000000", "0.015", "365", "300000", "30000000"][k] || "10"; }); vue().querySelector("[data-valider]").click(); await pause(30); },
    "correlation-3": async () => { w.localStorage.setItem("niveaux", JSON.stringify({ correlation: { niveau: 3, mode: "choisi" } })); await aller("chiffres/correlation"); },
    "double-piege": async () => { w.localStorage.setItem("niveaux", JSON.stringify({ graphiques: { niveau: 3, mode: "choisi" } })); await aller("chiffres/graphiques"); choix(0); await pause(20); suivant(); await pause(20); const c = vue().querySelectorAll(".choix"); c[0].click(); c[2].click(); const f = vue().querySelector(".figure-piege"); w.scrollTo(0, f.getBoundingClientRect().top + w.scrollY - 10); },
    "depistage-3": async () => { w.localStorage.setItem("niveaux", JSON.stringify({ depistage: { niveau: 3, mode: "choisi" } })); await aller("tests/depistage"); },
    "regle-3": async () => { w.localStorage.setItem("niveaux", JSON.stringify({ "regle-246": { niveau: 3, mode: "choisi" } })); w.localStorage.setItem("resultatsAteliers", JSON.stringify({ "regle-246": { n: 1, historique: [] } })); await aller("tests/regle-246"); },
    "thog": async () => { await aller("tests/wason"); for (let k = 0; k < 2; k++) { const c = vue().querySelectorAll(".carte-wason:not(:disabled)"); c[0].click(); c[1].click(); valider(); await pause(20); const s = vue().querySelector("[data-suivant]"); if (s && k === 0) { s.click(); await pause(20); } } const t = [...vue().querySelectorAll("h3")].find(h => /THOG/.test(h.textContent)); if (t) w.scrollTo(0, t.getBoundingClientRect().top + w.scrollY - 10); },
    "debat-3": async () => { w.localStorage.setItem("niveaux", JSON.stringify({ "debat-truque": { niveau: 3, mode: "choisi" } })); await aller("tests/debat-truque"); for (let k = 0; k < 12; k++) { if (/en contient deux|Lequel/.test(vue().textContent)) break; choix(1); await pause(20); if (/en contient deux|Lequel/.test(vue().textContent)) break; suivant(); await pause(20); } const c = vue().querySelector(".consigne:last-of-type"); },
    "premisse": async () => { w.localStorage.setItem("niveaux", JSON.stringify({ reparer: { niveau: 3, mode: "choisi" } })); await aller("tests/reparer"); },
    "chrono": async () => { await aller("quiz/chrono"); choix(0); await pause(20); },
    "cartes": async () => { await aller("tests/debat-a-deux"); vue().querySelector(".option-certitude input").click(); valider(); await pause(30); },
    "guide": async () => { await aller("guide/philosophie"); },
    "guide-haut": async () => { await aller("guide/difference"); },
    // Les neuf illusions du jour, chacune avant et après « Vérifier » (illusions.js), sur une seule page
    "illusions": async () => {
      await aller("accueil");
      const zone = vue();
      zone.replaceChildren();
      const grille = d.createElement("div");
      grille.className = "cartes-grille";
      w.eval("ILLUSIONS_DU_JOUR").forEach(ill => [false, true].forEach(revele => {
        const s = w.eval("svg")("svg", { viewBox: "0 0 320 200", class: "illusion-dessin" + (revele ? " revele" : "") });
        ill.dessiner(s);
        const c = d.createElement("div"); c.className = "carte"; c.append(ill.titre + (revele ? " (révélée)" : ""), s);
        grille.appendChild(c);
      }));
      zone.appendChild(grille);
      await pause(900);
    },
    // Lot 3 : fiche tirée au hasard (bandeau), cartes recto et verso, défi libre
    "tirage": async () => { await aller("biais"); d.getElementById("btn-hasard").click(); await pause(700); w.scrollTo(0, 0); },
    "cartes": async () => { await aller("cartes/biais"); await pause(500); },
    "cartes-verso": async () => { await aller("cartes/biais"); vue().querySelector("[data-retourner]").click(); await pause(500); },
    "defi-libre": async () => { await aller("defi/123"); },
    // Bilan de la Planche de Galton : douze questions jouées (états simulés), un anneau par catégorie
    "galton-bilan": async () => {
      await aller("chiffres/melange");
      const m = w.eval("melange");
      Object.assign(m, { juste: 8, total: 12, passees: 1, parSection: { monde: { juste: 3, total: 4, couleur: "#1f8a70" }, perception: { juste: 2, total: 4, couleur: "#c23b5a" }, raisonner: { juste: 2, total: 2, couleur: "#2f6db5" }, philosopher: { juste: 1, total: 2, couleur: "#9a4f9e" } } });
      w.eval("bilanMelange")(vue().querySelector(".melange"));
      await pause(900);
    },
    // Lot 4 : profil rempli (progression simulée sur dix semaines)
    "profil-rempli": async () => { await remplirProgression(); await aller("profil/ensemble"); await pause(800); },

    "portrait": async () => {
      w.localStorage.setItem("resultatsAteliers", JSON.stringify({ monde: { n: 3, record: 8, sur: 10, historique: [5, 7, 8], jour: 1 }, depistage: { n: 2, record: 3, sur: 4, historique: [2, 3] }, classiques: { n: 1, record: 4, sur: 5, historique: [4] }, citations: { n: 1, record: 6, sur: 8, historique: [6] } }));
      w.localStorage.setItem("confiance", JSON.stringify({ 50: [6, 3], 70: [14, 9], 90: [20, 14], 99: [8, 7] }));
      w.localStorage.setItem("fourchettes", JSON.stringify([30, 17]));
      w.localStorage.setItem("ancrages", JSON.stringify([{ j: 1, h: 1.4, b: 0.8 }, { j: 2, h: 1.2, b: 0.9 }]));

      w.localStorage.setItem("reponsesPensee", JSON.stringify({ poulet: 1, thesee: 2, theiere: 0 }));

  await pause(150);
  if (etapes[scenario]) await etapes[scenario]();
  else if (scenario.startsWith("aller:")) await aller(decodeURIComponent(scenario.slice(6)));
  if (!["quiz-faux-verdict", "accueil-agenda", "proches", "debat", "reparer", "reformuler", "entrainement", "moniteur-bilan", "carnet", "portrait-niveaux", "defi", "calcul-vf", "classement-nord", "double-piege", "thog"].includes(scenario)) w.scrollTo(0, 0);

  if (scenario.startsWith("schema:")) {
    await aller(decodeURIComponent(scenario.slice(7)));
    const sch = vue().querySelector(".schema");
    if (sch) w.scrollTo(0, sch.getBoundingClientRect().top + w.scrollY - 12);
