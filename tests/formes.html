<!DOCTYPE html>
<html lang="fr">
<meta charset="UTF-8">
<title>Les 39 schémas d'argument</title>
<!-- Relecture des découpages : les 39 schémas d'argument, rendus par le code du site (schemaArgument). Charge le site
     dans un cadre, puis y remplace la page par la liste. Capture : tests/pages/capturer_formes.sh (scénario « formes » de tests/_visu.html) -->
<iframe id="f" src="/_site.html#accueil" style="border: 0; width: 640px; height: 100vh; display: block"></iframe>
<script>
const f = document.getElementById("f");
f.onload = () => setTimeout(() => {
  const w = f.contentWindow, d = f.contentDocument;
  try {
  // Les sections de l'application sont masquées ; la liste prend leur place dans <main>
  const main = d.querySelector("main");
  main.querySelectorAll(":scope > section").forEach(s => { s.hidden = true; });
  const carte = d.createElement("article");
  carte.className = "carte carte-fiche";
  carte.style.animation = "none";   // sans fenêtre, Chrome ne fait pas toujours avancer l'animation d'apparition
  w.eval("SOPHISMES").forEach(s => {
    const titre = d.createElement("h3");
    titre.className = "consigne";
    titre.textContent = "S " + s.num + " · " + s.nom;
    const bloc = w.schemaArgument(s.forme);
    bloc.style.marginBottom = "18px";
    carte.append(titre, bloc);
  });
  main.appendChild(carte);
  w.scrollTo(0, 0);
  } catch (e) { document.body.prepend(e.message); }
}, 300);
</script>
