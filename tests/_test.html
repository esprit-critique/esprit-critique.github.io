<!DOCTYPE html>
<meta charset="UTF-8">
<body style="font: 13px monospace; background: #fff; color: #000; margin: 8px">
<pre id="out">en cours…</pre>
<iframe id="f" src="/_site.html#accueil" style="border: 0; display: block"></iframe>
<script>
// Banc d'essai général : fiches, quiz, révisions, navigation, clavier, sauvegarde. Taille : ?l=390&h=844
const params = new URLSearchParams(location.search);
document.getElementById("f").style.width = (params.get("l") || 390) + "px";
document.getElementById("f").style.height = (params.get("h") || 844) + "px";
const lignes = [];
const ok = (nom, cond, detail) => { const l = (cond ? "OK    " : "ÉCHEC ") + nom + (cond || !detail ? "" : " — " + detail); lignes.push(l); console.log("BANC: " + l); };
const pause = ms => new Promise(r => setTimeout(r, ms));
const erreursJS = [];
const f = document.getElementById("f");
let lance = false;
f.onload = async () => {
  if (lance) return;
  lance = true;
  try {
    const w = f.contentWindow;
    let d = f.contentDocument;
    w.addEventListener("error", e => erreursJS.push(e.message));
    const aller = async h => { w.location.hash = h; await pause(120); };
    const vue = () => d.querySelector("main > section:not([hidden])");
    const touche = (cle, cible) => (cible || d.body).dispatchEvent(new w.KeyboardEvent("keydown", { key: cle, bubbles: true }));
    // Reprise des données d'une ancienne version : liste « erreurs » et mode « erreurs »
    w.localStorage.clear();
    w.localStorage.setItem("erreurs", JSON.stringify(["biais:ancrage", "sophismes:post-hoc", "biais:inexistant"]));
    w.localStorage.setItem("modeQuiz", JSON.stringify("erreurs"));
    w.localStorage.setItem("acquis", JSON.stringify(["biais:halo", "biais:supprime"]));
    w.location.reload();
    await new Promise(res => { f.onload = res; });
    await pause(150);
    d = f.contentDocument;
    w.addEventListener("error", e => erreursJS.push(e.message));
    const memoireReprise = JSON.parse(w.localStorage.getItem("memoire") || "{}");
    ok("reprise : anciennes erreurs converties en révisions", Object.keys(memoireReprise).length === 2 && memoireReprise["biais:ancrage"].b === 1);
    ok("reprise : ancienne clé « erreurs » supprimée", w.localStorage.getItem("erreurs") === null);
    ok("reprise : 1 fiche acquise conservée, l'inconnue ignorée", d.querySelector(".tuile-nombre").textContent.startsWith("1 / 90"));
    await aller("quiz");
    ok("reprise : ancien mode « erreurs » devenu « À réviser »", d.querySelector("#filtres-quiz .puce.active").textContent.startsWith("À réviser"));
    w.localStorage.clear();
    w.location.reload();
    await new Promise(res => { f.onload = res; });
    await pause(150);
    d = f.contentDocument;
    w.addEventListener("error", e => erreursJS.push(e.message));
    await aller("accueil");

    // ---------- Accueil ----------
    ok("accueil visible", vue().id === "vue-accueil");
    ok("5 onglets", d.querySelectorAll(".onglet").length === 5);
    ok("onglet Accueil actif", d.querySelector(".onglet.actif").dataset.onglet === "accueil");
    ok("situation du jour : 4 choix", vue().querySelector("article.carte").querySelectorAll(".choix").length === 4);
    ok("vrai ou faux du jour : 2 choix", vue().querySelectorAll(".vf-jour .choix").length === 2);
    ok("3 tuiles de progression", vue().querySelectorAll(".tuile").length === 3);
    ok("plus de bandeau de couleurs", !d.getElementById("bandeau"));
    ok("emblème dans l'en-tête", !!d.querySelector(".marque .embleme"));
    vue().querySelectorAll(".choix")[0].click();
    ok("situation du jour : correction", !!vue().querySelector(".retour-quiz"));
    await aller("guide"); await aller("accueil");
    ok("situation du jour : réponse conservée", !!vue().querySelector(".retour-quiz"));
    ok("réponse enregistrée en mémoire", Object.keys(JSON.parse(w.localStorage.getItem("memoire") || "{}")).length === 1);

    // ---------- Fiches ----------
    await aller("biais");
    ok("liste biais : 6 groupes", vue().querySelectorAll(".groupe").length === 6);
    ok("liste biais : 51 lignes", vue().querySelectorAll(".ligne-fiche").length === 51);
    ok("onglet Fiches actif", d.querySelector(".onglet.actif").dataset.onglet === "fiches");
    ok("titre de page", d.title === "Biais · Esprit critique");
    await aller("sophismes");
    ok("liste sophismes : 8 groupes, 39 lignes", vue().querySelectorAll(".groupe").length === 8 && vue().querySelectorAll(".ligne-fiche").length === 39);
    const r = d.getElementById("recherche");
    r.value = "kahneman"; r.dispatchEvent(new Event("input"));
    ok("recherche sophismes « kahneman » → suggestion vers les biais", !!vue().querySelector('.vide a[href="#biais"]'));
    vue().querySelector('.vide a[href="#biais"]').click(); await pause(120);
    ok("recherche conservée en changeant de type : " + vue().querySelectorAll(".ligne-fiche").length + " biais", vue().querySelectorAll(".ligne-fiche").length > 5 && r.value === "kahneman");
    r.value = ""; r.dispatchEvent(new Event("input"));
    [...d.querySelectorAll("#filtres .puce")].find(p => p.textContent.includes("Mémoire")).click();
    ok("filtre Mémoire et attention : 7 fiches", vue().querySelectorAll(".ligne-fiche").length === 7);
    [...d.querySelectorAll("#filtres .puce")].find(p => p.textContent === "Toutes").click();

    // Toutes les pages de fiches
    let manquants = [], schemas = 0, distinctions = 0;
    const INDEX = w.eval("INDEX");
    for (const [cle, { type, fiche }] of INDEX) {
      w.location.hash = type + "/" + fiche.id;
      w.dispatchEvent(new HashChangeEvent("hashchange"));
      const titre = vue().querySelector(".fiche-titre");
      if (!titre || titre.textContent !== fiche.nom) manquants.push(cle);
      if (vue().querySelector(".schema svg")) schemas++;
      if (vue().querySelector(".distinction a")) distinctions++;
    }
    ok("90 pages de fiches" + (manquants.length ? " — manquantes : " + manquants.join(", ") : ""), manquants.length === 0 && INDEX.size === 90);
    ok("illustrations affichées : " + schemas, schemas === Object.keys(w.eval("SCHEMAS")).length);
    ok("« Ne pas confondre » : " + distinctions, distinctions === 90);
    await aller("biais/ancrage");
    vue().querySelector(".bouton-acquis").click();
    ok("marquer comme acquise", vue().querySelector(".bouton-acquis").classList.contains("oui"));
    await aller("biais");
    ok("coche dans la liste", [...vue().querySelectorAll(".ligne-fiche")].some(l => l.href.endsWith("#biais/ancrage") && l.querySelector(".lf-etat").textContent === "✓"));

    // ---------- Leurres du quiz : jamais une notion proche ----------
    const choisirOptions = w.eval("choisirOptions"), PROCHES = w.eval("PROCHES");
    let problemes = 0, tailles = new Set();
    for (const [cle, { type, fiche }] of INDEX) {
      for (let k = 0; k < 30; k++) {
        const opts = choisirOptions(type, fiche);
        tailles.add(opts.length);
        if (!opts.includes(fiche) || new Set(opts).size !== 4) problemes++;
        if (opts.some(o => o !== fiche && (PROCHES.get(cle) || new Set()).has(type + ":" + o.id))) problemes++;
      }
    }
    ok("2 700 tirages de leurres sans notion proche ni doublon", problemes === 0 && tailles.size === 1 && tailles.has(4));

    // ---------- Quiz ----------
    await aller("quiz");
    ok("quiz : 7 modes", vue().querySelectorAll("#filtres-quiz .puce").length === 7);
    ok("quiz : option « Indiquer ma certitude » cochée par défaut", vue().querySelector(".option-certitude input").checked);
    touche("2");
    ok("certitude : demandée avant la correction", !!vue().querySelector(".certitude") && !vue().querySelector(".retour-quiz"));
    touche("7");
    ok("clavier : touche 2 puis 7 (Sûr) répond", !!vue().querySelector(".retour-quiz") && !vue().querySelector(".certitude"));
    touche("Enter");
    ok("clavier : Entrée passe à la question 2", vue().querySelector(".quiz-entete").textContent.includes("Question 2 / 10"));
    for (let i = 1; i < 10; i++) {
      vue().querySelectorAll(".choix")[0].click();
      vue().querySelectorAll(".certitude [data-niveau]")[i % 3].click();
      vue().querySelector("[data-suivant]").click();
      await pause(5);
    }
    const cert = JSON.parse(w.localStorage.getItem("certitudes") || "{}");
    ok("certitude : 10 réponses comptées par niveau", ["sur", "plutot", "hasard"].reduce((t, k) => t + (cert[k] ? cert[k][0] : 0), 0) === 10);
    ok("quiz : bilan", vue().textContent.includes("Bilan de la série"));
    const mem = JSON.parse(w.localStorage.getItem("memoire"));
    ok("mémoire : " + Object.keys(mem).length + " fiches suivies", Object.keys(mem).length >= 10);
    // Simule des révisions dues : on avance toutes les dates
    Object.values(mem).forEach(m => { m.d = 0; });
    w.localStorage.setItem("memoire", JSON.stringify(mem));
    w.location.reload();
    await new Promise(res => { f.onload = res; });
    await pause(150);
    d = f.contentDocument;
    w.addEventListener("error", e => erreursJS.push(e.message));
    await aller("accueil");
    await aller("quiz");
    // Après un rechargement, la page peut mettre un instant à afficher les filtres du quiz
    for (let k = 0; k < 20 && !d.querySelector("#filtres-quiz .puce"); k++) await pause(100);
    const puceRev = [...d.querySelectorAll("#filtres-quiz .puce")].find(p => p.textContent.startsWith("À réviser"));
    ok("révisions dues : " + puceRev.textContent, /\((1[0-9]|[2-9][0-9])\)/.test(puceRev.textContent));
    puceRev.click(); await pause(50);
    ok("série de révision : 10 questions", vue().querySelector(".quiz-entete").textContent.includes("/ 10"));
    await aller("accueil");
    ok("accueil : carte de révision", vue().textContent.includes("à revoir aujourd'hui"));
    ok("accueil : rubrique « À renforcer » (barres ou message d'attente)", vue().querySelectorAll(".barre-ligne").length > 0 || vue().textContent.includes("catégories les plus fragiles"), [...vue().querySelectorAll(".carte")].map(c => c.textContent.slice(0, 60)).join(" | "));
    const ics = w.eval("exporterRevisions()");
    const lignesIcs = ics.split("\r\n");
    ok("agenda : fichier iCalendar (CRLF, VALUE=DATE, UID uniques, lignes ≤ 75 octets)",
      ics.startsWith("BEGIN:VCALENDAR\r\n") && ics.endsWith("END:VCALENDAR\r\n") && /DTSTART;VALUE=DATE:\d{8}/.test(ics) && !/[^\r]\n/.test(ics)
      && new Set(lignesIcs.filter(l => l.startsWith("UID:"))).size === lignesIcs.filter(l => l.startsWith("BEGIN:VEVENT")).length
      && lignesIcs.every(l => new TextEncoder().encode(l).length <= 75) && /notions? à réviser/.test(ics));

    // ---------- Certitude et boîtes de révision ----------
    const memC = w.eval("memoire");
    const cleT = [...w.eval("INDEX").keys()][5];
    delete memC[cleT];
    w.eval("enregistrerReponse")(cleT, true, "hasard");
    ok("certitude : bonne réponse au hasard, la notion ne monte pas de boîte", memC[cleT].b === 0 && memC[cleT].d === w.eval("aujourdHui()") + 1);
    w.eval("enregistrerReponse")(cleT, true, "sur");
    ok("certitude : bonne réponse sûre, la notion monte", memC[cleT].b === 1);
    w.eval("enregistrerReponse")(cleT, false, "sur");
    w.eval("noterCertitude")(cleT, "sur", false);
    ok("certitude : erreur sûre en boîte 1, révision demain, notée", memC[cleT].b === 1 && memC[cleT].d === w.eval("aujourdHui()") + 1 && JSON.parse(w.localStorage.getItem("erreursSures")).some(e => e.cle === cleT));

    // ---------- Mode « Notions proches » ----------
    await aller("quiz/proches");
    const serieP = w.eval("quiz.serie");
    const douteuses = w.eval("SITUATIONS_DOUTEUSES");
    ok("notions proches : 10 duels à deux réponses, X et sa voisine", serieP.length === 10 && serieP.every(q => q.options.length === 2 && q.options.includes(q.fiche) && q.options.includes(q.voisine.fiche) && q.fiche.distinction[0] === w.eval("cleFiche")(q.voisine.type, q.voisine.fiche)));
    ok("notions proches : aucune situation douteuse", serieP.every(q => !douteuses.has(w.eval("cleFiche")(q.type, q.fiche) + "#" + (q.cas === q.fiche.cas ? 1 : 2))));
    ok("notions proches : situations douteuses toutes valides", [...douteuses].every(x => w.eval("INDEX").has(x.split("#")[0])));
    const memAvant = JSON.stringify(w.eval("memoire"));
    vue().querySelectorAll(".choix")[0].click();
    vue().querySelectorAll(".certitude [data-niveau]")[1].click();
    ok("notions proches : « Ce qui les distingue » et liens vers les deux fiches", /Ce qui les distingue/.test(vue().textContent) && vue().querySelectorAll(".retour-quiz .voir-aussi a").length === 2);
    ok("notions proches : résultat dans « duels », pas dans les boîtes", JSON.stringify(w.eval("memoire")) === memAvant && Object.keys(JSON.parse(w.localStorage.getItem("duels"))).length === 1);
    for (let i = 1; i < 10; i++) {
      vue().querySelector("[data-suivant]").click();
      await pause(5);
      vue().querySelectorAll(".choix")[1].click();
      vue().querySelectorAll(".certitude [data-niveau]")[2].click();
    }
    vue().querySelector("[data-suivant]").click();
    await pause(5);
    ok("notions proches : bilan", /Bilan de la série/.test(vue().textContent));
    await aller("portrait");
    ok("portrait : notions proches et certitude", /Les notions proches/.test(vue().textContent) && /Certitude au quiz/.test(vue().textContent) && /Erreurs commises en étant sûr/.test(vue().textContent));
    await aller("quiz/tout");

    // ---------- Quiz : réponse libre ----------
    await aller("quiz/libre");
    ok("réponse libre : pas de propositions, un champ et pas de certitude", !vue().querySelector(".choix") && !!vue().querySelector(".reponse-libre input.champ"));
    const ql = w.eval("quiz.serie[quiz.index]");
    const champL = vue().querySelector(".reponse-libre input");
    champL.value = "ancr"; champL.dispatchEvent(new w.Event("input"));
    ok("réponse libre : suggestions pendant la saisie (« ancr » → Effet d'ancrage)", [...vue().querySelectorAll(".suggestions li")].some(li => /ancrage/i.test(li.textContent)));
    champL.dispatchEvent(new w.KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true }));
    champL.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    ok("réponse libre : flèche puis Entrée choisit la suggestion sans valider", champL.value.length > 4 && !vue().querySelector(".retour-quiz"));
    // Bonne réponse tapée sans accents ni majuscules
    const sansAccent = w.eval("normaliser")(ql.fiche.nom).toUpperCase();
    champL.value = sansAccent;
    const avantL = (w.eval("memoire")[w.eval("cleFiche")(ql.type, ql.fiche)] || { b: 0 }).b;
    vue().querySelector(".reponse-libre [data-valider]").click();
    ok("réponse libre : nom sans accents ni majuscules accepté", /Bonne réponse/.test(vue().textContent));
    ok("réponse libre : la notion monte d'une boîte", w.eval("memoire")[w.eval("cleFiche")(ql.type, ql.fiche)].b === Math.min(5, avantL + 1));
    vue().querySelector("[data-suivant]").click();
    await pause(10);
    const champL2 = vue().querySelector(".reponse-libre input");
    champL2.value = "n'importe quoi";
    vue().querySelector(".reponse-libre [data-valider]").click();
    ok("réponse libre : réponse inconnue signalée", /ne correspond à aucune fiche/.test(vue().textContent));
    const ql2 = w.eval("quiz.serie[quiz.index]");
    ok("réponse libre : erreur, retour en boîte 1", w.eval("memoire")[w.eval("cleFiche")(ql2.type, ql2.fiche)].b === 1);
    await aller("quiz/tout");

    // ---------- Thème, hors ligne, repérages ----------
    d.querySelector('[data-theme-choix="dark"]').click();
    ok("thème : sombre choisi à la main", d.documentElement.dataset.theme === "dark" && JSON.parse(w.localStorage.getItem("theme")) === "dark" && d.querySelector('[data-theme-choix="dark"]').getAttribute("aria-pressed") === "true");
    ok("thème : le fond suit le choix", w.getComputedStyle(d.body).backgroundColor === "rgb(22, 19, 15)");
    d.querySelector('[data-theme-choix="light"]').click();
    ok("thème : clair choisi à la main", w.getComputedStyle(d.body).backgroundColor === "rgb(246, 244, 239)");
    d.querySelector('[data-theme-choix="auto"]').click();
    ok("thème : retour à l'automatique", !d.documentElement.dataset.theme && w.localStorage.getItem("theme") === null);
    // Hors ligne : sw.js garde en cache tous les scripts de la page, et chaque fichier listé existe
    const sw = await (await fetch("sw.js", { cache: "no-store" })).text();
    const fichiersSW = JSON.parse(sw.match(/const FICHIERS = (\[[\s\S]*?\]);/)[1]);
    const scripts = [...d.querySelectorAll("script[src]")].map(s => s.getAttribute("src"));
    const absents = [];
    for (const f of fichiersSW) if (!(await fetch(f, { cache: "no-store" })).ok) absents.push(f);
    ok("hors ligne : sw.js liste tous les scripts, et chaque fichier listé existe", scripts.every(s => fichiersSW.includes(s)) && absents.length === 0, scripts.filter(s => !fichiersSW.includes(s)).concat(absents).join(", "));
    ok("hors ligne : enregistrement réservé à la page elle-même", /window\.top === window/.test(await (await fetch("app.js", { cache: "no-store" })).text()));
    await aller("biais/ancrage");
    vue().querySelector(".reperage input").value = "une publicité de soldes";
    [...vue().querySelectorAll(".reperage button")].find(b => /repéré/.test(b.textContent)).click();
    await pause(5);
    ok("repérage : noté sur la fiche", /Repéré 1 fois/.test(vue().textContent) && JSON.parse(w.localStorage.getItem("reperages"))[0].note === "une publicité de soldes");
    await aller("portrait");
    ok("repérage : bloc du portrait", /Vos repérages/.test(vue().textContent) && /une publicité de soldes/.test(vue().textContent));


    // ---------- Fiches : aucun contenu perdu (les 90 fiches) ----------
    // Comparaison sans les espaces : la typographie (espaces insécables) et le découpage en lignes n'y changent rien
    const sansEspaces = t => String(t).replace(/\s+/g, "");
    const manques = [], hierarchie = [];
    for (const r of w.eval("INDEX").values()) {
      const { type, fiche } = r;
      const cle = type + ":" + fiche.id;
      await aller(type + "/" + fiche.id);
      const carte = vue().querySelector("article.carte");
      const texte = sansEspaces(carte.textContent);
      const contient = (nom, valeur) => { if (valeur && !texte.includes(sansEspaces(Array.isArray(valeur) ? valeur.join(" ") : valeur))) manques.push(cle + " : " + nom); };
      ["definition", "forme", "mecanisme", "exemple", "celebre", "parade", "source"].forEach(c => contient(c, fiche[c]));
      if (fiche.distinction) { contient("distinction", fiche.distinction[1]); const v = w.eval("INDEX").get(fiche.distinction[0]); if (v && !carte.querySelector('a[href="#' + v.type + "/" + v.fiche.id + '"]')) manques.push(cle + " : lien de distinction"); }
      if (w.eval("SCHEMAS")[cle] && !carte.querySelector("figure.schema svg")) manques.push(cle + " : illustration");
      if (w.eval("entrainementFiche")(type, fiche) && !carte.querySelector(".entrainement .exercice")) manques.push(cle + " : exercices");
      const ateliersF = w.eval("ateliersDeLaFiche")(cle);
      if (ateliersF.length && carte.querySelectorAll(".ateliers-fiche a").length !== ateliersF.length) manques.push(cle + " : ateliers");
      (fiche.lies || []).forEach(l => { const v = w.eval("INDEX").get(l); if (v && !carte.querySelector('.voir-aussi a[href="#' + v.type + "/" + v.fiche.id + '"]')) manques.push(cle + " : voir aussi " + l); });
      // Hiérarchie des titres : un seul h1, en premier ; un h3 seulement sous un h2 ou dans le groupe de tête
      const titres = [...carte.querySelectorAll("h1, h2, h3, h4")];
      let dernier = 0;
      titres.forEach((h, k) => {
        const n = Number(h.tagName[1]);
        if ((n === 1) !== (k === 0) || n === 4) hierarchie.push(cle + " : " + h.tagName + " « " + h.textContent + " »");
        else if (n === 3 && dernier < 2 && !h.closest(".tete-fiche")) hierarchie.push(cle + " : h3 sans h2 « " + h.textContent + " »");
        dernier = Math.max(dernier, n === 3 && h.closest(".tete-fiche") ? 1 : n);
      });
    }
    ok("fiches : hiérarchie des titres juste sur les 90 (h1, h2, h3 sans saut)", hierarchie.length === 0, hierarchie.slice(0, 6).join(" | "));
    ok("fiches : sur les 90, chaque champ rempli apparaît sur la page", manques.length === 0, manques.slice(0, 8).join(" | "));

    // ---------- Ouverture de l'accueil ----------
    const sauveActivite = w.localStorage.getItem("activite"), sauveResultats = w.localStorage.getItem("resultatsAteliers");
    w.localStorage.removeItem("activite"); w.localStorage.removeItem("resultatsAteliers");
    await aller("quiz"); await aller("accueil");
    const boutonOuv = vue().querySelector(".ouverture-dessin");
    ok("ouverture : visible pour un nouveau visiteur, avant l'appel à l'action", !!boutonOuv && boutonOuv.closest(".ouverture").nextElementSibling.classList.contains("appel-action"));
    boutonOuv.click();
    ok("ouverture : toucher révèle les repères (aria-pressed)", boutonOuv.getAttribute("aria-pressed") === "true" && boutonOuv.querySelector("svg").classList.contains("revele"));
    w.localStorage.setItem("activite", JSON.stringify([w.eval("aujourdHui()")]));
    await aller("quiz"); await aller("accueil");
    ok("ouverture : disparaît dès qu'une activité existe", !vue().querySelector(".ouverture"));
    if (sauveActivite !== null) w.localStorage.setItem("activite", sauveActivite); else w.localStorage.removeItem("activite");
    if (sauveResultats !== null) w.localStorage.setItem("resultatsAteliers", sauveResultats);

    // ---------- Numéros de catalogue ----------
    const numerosOk = ["biais", "sophismes"].every(t => { const n = w.eval("TYPES")[t].fiches.map(f => f.num).sort((a, b) => a - b); return n.every((v, i) => v === i + 1); });
    ok("numéros : uniques et sans trou, par type", numerosOk);
    await aller("biais/ancrage");
    ok("numéros : affiché sur la fiche, lu « Biais numéro » par les lecteurs d'écran", /^B\s\d+$/.test(vue().querySelector(".numero-fiche [aria-hidden]").textContent) && /Biais numéro \d+/.test(vue().querySelector(".numero-fiche .invisible").textContent));
    await aller("biais");
    const champR = d.getElementById("recherche");
    const ancrage = w.eval("trouverFiche")("biais", "ancrage");
    for (const saisie of ["B " + ancrage.num, "b" + ancrage.num]) {
      champR.value = saisie; champR.dispatchEvent(new w.Event("input")); await pause(20);
      ok("numéros : la recherche « " + saisie + " » trouve l'effet d'ancrage seul", vue().querySelectorAll(".ligne-fiche").length === 1 && /ancrage/.test(vue().querySelector(".ligne-fiche").textContent));
    }
    champR.value = "S7"; champR.dispatchEvent(new w.Event("input")); await pause(20);
    ok("numéros : « S7 » depuis les biais renvoie vers les sophismes", /1 résultat parmi les sophismes/.test(vue().textContent.replace(/[\u00a0\u202f]/g, " ")));
    champR.value = ""; champR.dispatchEvent(new w.Event("input")); await pause(20);

    // ---------- Trouver l'indice, situations supplémentaires ----------
    const toutes = [...w.eval("INDEX").values()];
    ok("situations supplémentaires : deux par fiche, toutes différentes", toutes.every(r => Array.isArray(r.fiche.casSup) && r.fiche.casSup.length === 2 && new Set([r.fiche.cas, r.fiche.cas2, ...r.fiche.casSup]).size === 4));
    const indices = w.eval("INDICES");
    ok("indices : 180 passages, chacun présent mot pour mot dans sa situation", Object.keys(indices).length === 180 && toutes.every(r => [1, 2].every(k => { const t = r.fiche[k === 1 ? "cas" : "cas2"]; const i = indices[w.eval("cleFiche")(r.type, r.fiche) + "#" + k]; return i && t.split(i).length === 2; })));
    w.eval('lancerQuiz("tout")');
    await aller("quiz/tout");
    const qI = w.eval("quiz").serie[w.eval("quiz").index];
    vue().querySelectorAll(".choix")[0].click(); await pause(3);
    const certI = vue().querySelectorAll(".certitude [data-niveau]");
    if (certI.length) { certI[0].click(); await pause(3); }
    const btnIndice = [...vue().querySelectorAll("button")].find(b => /Trouver l'indice/.test(b.textContent));
    ok("indice : bouton après la correction", !!btnIndice);
    btnIndice.click(); await pause(3);
    const passages = [...vue().querySelectorAll("p.cas .passage")];
    const espaces = t => t.replace(/[  ]/g, " ");
    const numI = qI.cas === qI.fiche.cas ? 1 : 2;
    const attendu = indices[w.eval("cleFiche")(qI.type, qI.fiche) + "#" + numI];
    const debutI = espaces(passages.map(p => p.textContent).join("")).indexOf(attendu);
    ok("indice : la situation se découpe en passages qui la recomposent", passages.length >= 2 && espaces(passages.map(p => p.textContent).join("")) === espaces(qI.cas) && debutI >= 0);
    passages.find(p => Number(p.dataset.debut) <= debutI && Number(p.dataset.fin) > debutI).click(); await pause(3);
    ok("indice : passage juste, indice surligné", /Bien vu/.test(vue().textContent) && espaces(vue().querySelector("p.cas mark.indice").textContent) === attendu);
    // Révision : une situation supplémentaire, différente d'une révision à l'autre
    w.eval('memoire["biais:ancrage"] = { b: 1, d: -100000, n: 3, j: 2 }; lancerQuiz("reviser")');
    await aller("quiz");
    const qR = w.eval("quiz").serie.find(q => q.fiche.id === "ancrage" && q.type === "biais");
    ok("révision : situation supplémentaire en priorité", !!qR && qR.cas === qR.fiche.casSup[1], "mode " + w.eval("quiz").mode + ", série " + w.eval("quiz").serie.map(q => q.fiche.id).join(",") + ", cas " + (qR ? qR.cas.slice(0, 50) : "absent"));
    await aller("quiz/tout");

    // ---------- Quiz chrono ----------
    await aller("quiz/chrono");
    ok("quiz chrono : chronomètre en texte, question à quatre propositions", /Reste : 60 s/.test(vue().textContent.replace(/[\u202f\u00a0]/g, " ")) && vue().querySelectorAll(".choix").length === 4);
    const qChrono = w.eval("quiz");
    vue().querySelectorAll(".choix")[0].click(); await pause(5);
    vue().querySelectorAll(".choix")[1].click(); await pause(5);
    ok("quiz chrono : chaque réponse enchaîne une nouvelle question", vue().querySelectorAll(".choix").length === 4 && /points/.test(vue().querySelector(".chrono-points").textContent));
    await pause(61000);
    // La fin est constatée au déclenchement suivant du minuteur (que Safari espace parfois) : jusqu'à 5 s de plus
    for (let k = 0; k < 50 && !/Temps écoulé/.test(vue().textContent); k++) await pause(100);
    const recChrono = JSON.parse(w.localStorage.getItem("chrono") || "{}");
    ok("quiz chrono : fin après 60 s, record enregistré", /Temps écoulé/.test(vue().textContent) && recChrono.quiz !== undefined);
    await aller("quiz/tout");

    // ---------- Défi du jour ----------
    w.localStorage.removeItem("defiJour");
    await aller("accueil");
    const jourD = w.eval("aujourdHui()");
    const d1 = w.eval("questionsDuDefi")(jourD), d2 = w.eval("questionsDuDefi")(jourD), dDemain = w.eval("questionsDuDefi")(jourD + 1);
    ok("défi : 10 questions, les mêmes toute la journée, d'autres demain", d1.length === 10 && d1.map(q => q.texte).join() === d2.map(q => q.texte).join() && d1.map(q => q.texte).join() !== dDemain.map(q => q.texte).join());
    ok("défi : chaque question a sa bonne réponse parmi les options", d1.every(q => q.options[q.juste] !== undefined && q.explication));
    [...vue().querySelectorAll(".defi-jour button")].find(b => /Relever/.test(b.textContent)).click();
    for (let k = 0; k < 10; k++) {
      touche("1");
      await pause(5);
      vue().querySelector(".defi-jour [data-suivant]").click();
      await pause(5);
    }
    const memoD = JSON.parse(w.localStorage.getItem("defiJour"));
    ok("défi : résultat enregistré et affiché, avec partage", memoD && memoD.jour === jourD && /\/ 10/.test(vue().querySelector(".defi-jour").textContent) && /Partager/.test(vue().querySelector(".defi-jour").textContent));
    await aller("guide"); await aller("accueil");
    ok("défi : une seule tentative par jour", !/Relever le défi/.test(vue().textContent) && new RegExp(memoD.score + " / 10").test(vue().querySelector(".defi-jour").textContent.replace(/\s+/g, " ")));

    // ---------- Ateliers ----------
    await aller("ateliers");
    ok("ateliers : 45 cartes", vue().querySelectorAll(".atelier").length === 45);
    ok("onglet Ateliers actif", d.querySelector(".onglet.actif").dataset.onglet === "ateliers");
    await aller("chiffres");
    ok("#chiffres renvoie à la liste", vue().id === "vue-ateliers");
    for (const id of ["monde", "mortalite", "pays", "nord", "grandeurs", "chronologie", "vrai-faux", "intervalles", "ancre", "points", "illusion", "hasard", "ecrire-hasard", "correlation", "graphiques"]) {
      await aller("chiffres/" + id);
      ok("jeu " + id + " : page et lien retour", vue().id === "vue-chiffres" && !!vue().querySelector('a[href="#ateliers"]'));
    }
    for (const id of ["crt", "wason", "regle-246", "monty-hall", "classiques", "depistage", "anniversaires", "pensee", "citations"]) {
      await aller("tests/" + id);
      ok("expérience " + id, vue().id === "vue-tests" && !!vue().querySelector(".fiche-titre"));
    }
    // Entrée dans les champs : passe au suivant, puis valide (les trois questions originales, comme au premier passage)
    const vusCrt = JSON.parse(w.localStorage.getItem("vus") || "{}");
    delete vusCrt.crt;
    w.localStorage.setItem("vus", JSON.stringify(vusCrt));
    await aller("accueil");
    await aller("tests/crt");
    const champs = vue().querySelectorAll(".champ");
    champs[0].focus(); champs[0].value = "5"; touche("Enter", champs[0]);
    ok("Entrée : passe au champ suivant", d.activeElement === champs[1]);
    champs[1].value = "5"; champs[2].value = "47"; touche("Enter", champs[2]);
    ok("Entrée : valide le test (3/3)", (vue().querySelector(".grand-score") || {}).textContent.replace(/\s/g, "") === "3/3");
    await aller("ateliers");
    ok("ateliers : partie du test marquée", [...vue().querySelectorAll(".atelier .badge")].filter(b => b.textContent).length === 1);

    // ---------- Guide ----------
    await aller("guide/methode");
    ok("guide : section méthode", vue().id === "vue-guide" && !!d.getElementById("g-methode"));
    ok("guide : lexique", d.querySelectorAll("#g-lexique dt").length >= 15);
    ok("bouton effacer présent", !!d.getElementById("btn-effacer"));
    // Liens internes du guide valides
    const liensCasses = [...d.querySelectorAll('#vue-guide a[href^="#biais/"], #vue-guide a[href^="#sophismes/"]')]
      .filter(a => { const [t, id] = a.getAttribute("href").slice(1).split("/"); return !w.eval("INDEX").has(t + ":" + id); });
    ok("liens du guide vers les fiches : tous valides", liensCasses.length === 0);

    // ---------- Import d'une sauvegarde : fichiers mal formés ou piégés ----------
    const importer = contenu => {
      w.confirm = () => true;
      const champ = d.getElementById("fichier-import");
      const dt = new w.DataTransfer();
      dt.items.add(new w.File([contenu], "sauvegarde.json", { type: "application/json" }));
      champ.files = dt.files;
      champ.dispatchEvent(new w.Event("change"));
    };
    // La lecture du fichier se fait hors du temps virtuel de Chrome : on attend le message lui-même, pas un délai
    const annonceImport = new Promise(res => new w.MutationObserver((m, o) => { if (/pas une sauvegarde/.test(d.getElementById("annonce").textContent)) { o.disconnect(); res(); } })
      .observe(d.getElementById("annonce"), { childList: true, characterData: true, subtree: true }));
    importer(JSON.stringify({ application: "Esprit critique", cles: null }));
    await annonceImport;
    ok("import : sauvegarde sans clés refusée, sans erreur", /pas une sauvegarde/.test(d.getElementById("annonce").textContent));
    const recharge = new Promise(res => { f.onload = res; });
    importer(JSON.stringify({ application: "Esprit critique", date: "illisible", cles: { acquis: ["biais:ancrage"], memoire: "piège", theme: 3, inconnue: 1 } }));
    await recharge; await pause(300);
    ok("import : clés valides reprises, valeurs d'une autre forme et clés inconnues ignorées",
      w.localStorage.getItem("acquis") === '["biais:ancrage"]' && w.localStorage.getItem("memoire") === null && w.localStorage.getItem("theme") === null && w.localStorage.getItem("inconnue") === null
      && !!f.contentDocument.querySelector("main > section:not([hidden])"));

    // ---------- Sauvegardes automatiques ----------
    const sauvegardes = JSON.parse(w.localStorage.getItem("sauvegardesAuto") || "[]");
    ok("sauvegardes automatiques : copie du jour et copie avant import, quatre au plus", sauvegardes.length <= 4
      && sauvegardes.some(s => s.motif === "quotidienne" && s.jour === w.eval("aujourdHui()")) && sauvegardes.some(s => s.motif === "avant import"));
    const avantImport = sauvegardes.find(s => s.motif === "avant import");
    const valeurDe = cle => avantImport.cles[cle] === undefined ? "absente" : JSON.stringify(avantImport.cles[cle]);
    w.confirm = () => true;
    const recharge2 = new Promise(res => { f.onload = res; });
    // La liste affichée va de la plus récente à la plus ancienne
    [...f.contentDocument.querySelectorAll("#sauvegardes-auto button")][sauvegardes.length - 1 - sauvegardes.indexOf(avantImport)].click();
    await recharge2; await pause(300);
    const apres = JSON.parse(w.localStorage.getItem("sauvegardesAuto") || "[]");
    ok("sauvegardes automatiques : la copie d'avant l'import est restaurée, l'état remplacé est gardé",
      ["acquis", "memoire", "modeQuiz"].every(c => (w.localStorage.getItem(c) ?? "absente") === valeurDe(c)) && apres.some(s => s.motif === "avant restauration") && apres.length <= 4);
  } catch (e) {
    lignes.push("EXCEPTION " + e.message + "\n" + e.stack);
  }
  ok("aucune erreur JavaScript" + (erreursJS.length ? " : " + erreursJS.join(" | ") : ""), erreursJS.length === 0);
  const echecs = lignes.filter(l => !l.startsWith("OK")).length;
  lignes.unshift("RÉSUMÉ : " + (lignes.length - echecs) + " / " + lignes.length + " vérifications réussies");
  document.getElementById("out").textContent = lignes.join("\n");
  lignes.forEach(l => String(l).split("\n").forEach(x => console.log("RAPPORT: " + x)));
  console.log("RAPPORT-FIN");
  f.remove();
};
</script>
