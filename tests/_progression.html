<!DOCTYPE html>
<meta charset="UTF-8">
<body style="font: 13px monospace; background: #fff; color: #000; margin: 8px">
<pre id="out">en cours…</pre>
<iframe id="f" src="/_site.html#accueil" style="border: 0; display: block; width: 390px; height: 844px"></iframe>
<script>
// Banc « progression » (lot 4) : maîtrise de chaque type de jeu, table des jeux, domaines, grades et leurs délais pour des
// joueurs simulés, photographie quotidienne, barème des points et ses seuils, plafonds, distinctions, jour de repos,
// idempotence du rattrapage, mode sobre. Les fonctions de progression.js sont pures : on les appelle directement.
const lignes = [];
const ok = (nom, cond, detail) => { lignes.push((cond ? "OK    " : "ÉCHEC ") + nom + (cond || !detail ? "" : " — " + detail)); console.log("BANC: " + lignes[lignes.length - 1]); };
const pause = ms => new Promise(r => setTimeout(r, ms));
const erreursJS = [];
const f = document.getElementById("f");
let lance = false;
f.onload = async () => {
  if (lance) return;
  lance = true;
  const w = f.contentWindow;
  w.addEventListener("error", e => erreursJS.push(e.message));
  const ev = x => w.eval(x);
  try {
    w.localStorage.clear();
    const MJ = ev("MAITRISE_JEUX"), ateliers = ev("tousLesAteliers()").map(a => a.atelier.id);
    ok("table des jeux : chaque atelier y figure (" + ateliers.length + " ateliers)", ateliers.every(id => MJ[id]), ateliers.filter(id => !MJ[id]).join(", "));
    ok("table des jeux : domaines, types et parts de hasard valides", Object.values(MJ).every(([d, t, c]) => ["monde", "confiance", "perception", "raisonner", "debattre", "melange"].includes(d) && ["note", "mesure", "aucun"].includes(t) && c >= 0 && c < 1));

    // ---------- Maîtrise d'un jeu noté ----------
    const noteNiveau = (L, reussite, parties = 5) => ({ niveaux: { [L]: { n: parties, sur: 20, historique: Array(parties).fill(20 * reussite) } } });
    const mN = (r, c) => Math.round(ev("maitriseNotee")(r, c));
    ok("jeu noté : 85 % à quatre réponses donne 400 / 600 / 800 aux niveaux 1, 2, 3", mN(noteNiveau(1, 0.85), 0.25) === 400 && mN(noteNiveau(2, 0.85), 0.25) === 600 && mN(noteNiveau(3, 0.85), 0.25) === 800,
      [1, 2, 3].map(L => mN(noteNiveau(L, 0.85), 0.25)).join(" / "));
    ok("jeu noté : une seule partie compte pour un cinquième", mN(noteNiveau(1, 0.85, 1), 0.25) === 80);
    ok("jeu noté : répondre au hasard donne 0", mN(noteNiveau(2, 0.25), 0.25) === 0 && mN(noteNiveau(2, 0.5), 0.5) === 0);
    ok("jeu noté : la meilleure valeur des niveaux est gardée", mN({ niveaux: { 1: noteNiveau(1, 1).niveaux[1], 3: noteNiveau(3, 0.4).niveaux[3] } }, 0.25) === 500);
    ok("jeu noté : 100 % au niveau 3 sur cinq parties donne 1 000", mN(noteNiveau(3, 1), 0) === 1000);
    // Audit A6 : trois parties chanceuses au plus haut niveau ne fixent plus la maîtrise (600 et non 1 000), et la
    // moyenne porte sur les dix dernières parties
    ok("audit A6 : trois parties parfaites au niveau 3 donnent 600 (pleine confiance à cinq parties)", mN(noteNiveau(3, 1, 3), 0) === 600, String(mN(noteNiveau(3, 1, 3), 0)));
    ok("audit A6 : la moyenne porte sur les dix dernières parties", mN({ niveaux: { 3: { n: 10, sur: 10, historique: [0, 0, 0, 0, 0, 10, 10, 10, 10, 10] } } }, 0) === 500);
    // Plafonds proportionnels à la difficulté : 500 au niveau 1, 1 000 au plus haut niveau de l'atelier (3 ou 5)
    const pl = ev("plafondNiveau");
    ok("plafonds : 500 / 750 / 1 000 (trois niveaux), 500 / 625 / 750 / 875 / 1 000 (cinq niveaux)",
      [1, 2, 3].map(L => pl(L, 3)).join() === "500,750,1000" && [1, 2, 3, 4, 5].map(L => pl(L, 5)).join() === "500,625,750,875,1000");
    const mN5 = (r, c) => Math.round(ev("maitriseNotee")(r, c, 5));
    ok("jeu à cinq niveaux : 100 % au niveau 5 donne 1 000, au niveau 3 donne 750", mN5(noteNiveau(5, 1), 0) === 1000 && mN5(noteNiveau(3, 1), 0) === 750,
      mN5(noteNiveau(5, 1), 0) + " / " + mN5(noteNiveau(3, 1), 0));
    // Mesures particulières
    const vide = { aujourdhui: 20000 };
    ok("mesures : ancrage nul sur trois parties → 1 000 ; effet de 50 % → 0", Math.round(ev("MESURES").ancre({ ancrages: [1, 2, 3].map(() => ({ h: 1, b: 1 })) })) === 1000 && Math.round(ev("MESURES").ancre({ ancrages: [1, 2, 3].map(() => ({ h: 1.5, b: 1 })) })) === 0);
    // Audit A2 : le carnet (issue indiquée par le joueur) sort de la maîtrise ; « Prévisionniste » demande des
    // prévisions faites sept jours à l'avance au moins, sur cinq jours différents (issues « oui » / « non » du carnet)
    ok("audit A2 : le carnet ne compte pas dans la maîtrise", MJ.carnet[1] === "aucun" && ev("maitriseJeu")("carnet", { previsions: Array(10).fill({ p: 95, issue: "oui", creee: 100, echeance: 100 }) }) === 0);
    const prev = (ecart, jours) => Array.from({ length: 10 }, (_, k) => ({ id: "p" + k, texte: "x", p: 90, issue: "oui", creee: 100 + (k % jours), echeance: 100 + (k % jours) + ecart }));
    const prevOk = l => ev("distinctionsObtenues")({ previsions: l, ateliers: [], aujourdhui: 200, categorieDe: () => "" }).includes("previsionniste");
    ok("audit A2 : « Prévisionniste » refusé pour des prévisions du jour même, ou faites en un seul jour ; accordé sinon", !prevOk(prev(0, 5)) && !prevOk(prev(7, 1)) && prevOk(prev(7, 5)));
    // Audit A4 : étalonnage par le score de Brier ; annoncer 50 % partout et répondre au hasard ne rapporte plus rien
    ok("audit A4 : « 50 % » partout avec moitié de réussite → 0 (l'ancien écart donnait 1 000)", Math.round(ev("maitriseEtalonnage")({ confiance: { 50: [40, 20] } })) === 0);
    ok("audit A4 : 99 % et toujours juste sur 40 réponses → 1 000 ; se tromper exprès en annonçant 70 % fait baisser", Math.round(ev("maitriseEtalonnage")({ confiance: { 99: [40, 40] } })) === 1000
      && ev("maitriseEtalonnage")({ confiance: { 70: [40, 28] } }) > ev("maitriseEtalonnage")({ confiance: { 70: [40, 20] } }));
    ok("audit A4 : « Je sais que je ne sais pas » demande aussi 85 % de réussite quand on est sûr", (() => {
      const o = c => ev("distinctionsObtenues")({ certitudes: c, ateliers: [], aujourdhui: 100, categorieDe: () => "" }).includes("je-sais");
      return !o({ hasard: [25, 5] }) && !o({ hasard: [25, 5], sur: [20, 10] }) && o({ hasard: [25, 5], sur: [20, 18] });
    })());
    // Audit A3 : fourchettes notées par le score de fourchette ; des fourchettes immenses ne rapportent rien
    const sf = (v, b, h) => ev("scoreFourchette")({ v, unite: "km" }, b, h, 0.1);
    ok("audit A3 : fourchettes de 0 à 10¹² → note 0 ; justes d'un facteur 4 → 8 ; d'un facteur 10 → 7", ev("noteFourchettes")([sf(1e6, 0, 1e12)]) === 0
      && ev("noteFourchettes")([sf(1e6, 5e5, 2e6)]) === 8 && ev("noteFourchettes")([sf(1e6, 5e5, 5e6)]) === 7);
    const intervallesAnciens = { intervalles: { n: 5, sur: 10, niveaux: { 3: { n: 5, sur: 10, historique: [10, 10, 10, 10, 10] } } } };
    const intervallesNotes = { intervalles: { n: 5, sur: 10, niveaux: { 3: { n: 5, sur: 10, largeur: 1, historique: [7, 7, 7, 7, 7] } } } };
    ok("audit A3 : les anciennes parties, notées au nombre de fourchettes justes, ne comptent plus ; les nouvelles oui",
      ev("maitriseJeu")("intervalles", { resultatsAteliers: intervallesAnciens }) === 0 && Math.round(ev("maitriseJeu")("intervalles", { resultatsAteliers: intervallesNotes })) === 700);
    ok("audit A3 : « Fourchettes honnêtes » demande aussi 300 de maîtrise aux fourchettes", (() => {
      const o = r => ev("distinctionsObtenues")({ fourchettes: [30, 27], resultatsAteliers: r, ateliers: [], aujourdhui: 100, categorieDe: () => "" }).includes("fourchettes");
      return !o(intervallesAnciens) && o(intervallesNotes);
    })());
    // Domaines : un jeu jamais joué compte pour zéro
    const m1 = ev("maitrises")({ resultatsAteliers: { monde: noteNiveau(3, 1) } }, ateliers, 90);
    const jeuxMonde = Object.values(m1.jeux).filter(([d]) => d === "monde").length;
    ok("domaines : un seul jeu parfait sur " + jeuxMonde + " dans « le monde en chiffres » donne 1 000 / " + jeuxMonde, m1.domaines.monde === Math.round(1000 / jeuxMonde), String(m1.domaines.monde));
    ok("domaines : six domaines, maîtrise globale = leur moyenne", Object.keys(m1.domaines).length === 6 && m1.globale === Math.round(Object.values(m1.domaines).reduce((s, x) => s + x, 0) / 6));
    ok("notions : 90 notions en boîte 5 donnent 800 sans duels", ev("maitriseNotions")({ memoire: Object.fromEntries(Array.from({ length: 90 }, (_, k) => ["x" + k, { b: 5 }])) }, 90) === 800);
    const gt = ev("maitriseGrandTest")({ grandTest: { historiqueTests: [{ mode: "complet", dateFin: "2026-11-01T00:00:00Z", scores: { A: { valeur: 1, n: 20 }, B: { valeur: 0.25, n: 20 }, E: { valeur: 0, n: 30, brier: 0 }, F: { valeur: 0.9, n: 10 } } }] } });
    // Axe E : score de Brier ; un écart nul obtenu en se trompant exprès (Brier 0,25) ne rapporte rien
    const gtE = ev("maitriseGrandTest")({ grandTest: { historiqueTests: [{ mode: "complet", dateFin: "2026-11-01T00:00:00Z", scores: { E: { valeur: 0, n: 30, brier: 0.25 } } }] } });
    const gtAncien = ev("maitriseGrandTest")({ grandTest: { historiqueTests: [{ mode: "complet", dateFin: "2026-11-01T00:00:00Z", scores: { E: { valeur: 0, n: 30 } } }] } });
    ok("Grand test, axe E : Brier de 0,25 → 0 malgré un écart nul ; un ancien test sans Brier ne compte pas pour E", gtE.E[1] === 0 && !gtAncien.E, JSON.stringify([gtE, gtAncien]));
    // Audit A9 : un Grand test refait sur des items déjà vus ne compte pas
    const gtVu = ev("maitriseGrandTest")({ grandTest: { historiqueTests: [{ mode: "complet", dateFin: "2026-11-01T00:00:00Z", instances: [{ dejaVu: true }, { dejaVu: true }, { dejaVu: false }], scores: { A: { valeur: 1, n: 20 } } }] } });
    ok("audit A9 : Grand test dont la plupart des items étaient déjà vus : ignoré", Object.keys(gtVu).length === 0, JSON.stringify(gtVu));
    ok("Grand test : ses axes comptent dans les domaines (A parfait → 1 000, B au hasard → 0, E sans excès → 1 000, F exclu)", gt.A[1] === 1000 && gt.B[1] === 0 && gt.E[1] === 1000 && !gt.F && gt.A[0] === "raisonner", JSON.stringify(gt));

    // ---------- Grades ----------
    const g = s => ev("gradeDe")(s).nom;
    ok("grades : seuils 0, 5, 25, 60, 120, 220, 350, 500, 650, 800", [0, 5, 25, 60, 120, 220, 350, 500, 650, 800].map(g).join() === "Novice,Élève,Sceptique,Détective,Analyste,Stratège,Philosophe,Virtuose,Maître,Esprit critique" && g(4) === "Novice" && g(799) === "Maître");
    let photo = null;
    photo = ev("photographier")(photo, 100, { globale: 300, domaines: {} });
    photo = ev("photographier")(photo, 101, { globale: 200, domaines: {} });
    ok("photographie : un grade acquis ne se perd pas (meilleure maîtrise gardée)", photo.meilleure === 300 && photo.jours[101][0] === 200 && photo.depuis === 100);
    // Audit A6 : la meilleure maîtrise est le minimum des trois derniers jours photographiés
    let lisse = ev("photographier")(null, 10, { globale: 100, domaines: {} });
    lisse = ev("photographier")(lisse, 11, { globale: 900, domaines: {} });
    const pic = lisse.meilleure;
    lisse = ev("photographier")(lisse, 12, { globale: 900, domaines: {} });
    lisse = ev("photographier")(lisse, 13, { globale: 900, domaines: {} });
    ok("audit A6 : un pic d'un jour ne fixe pas la meilleure maîtrise (100), trois jours de suite oui (900)", pic === 100 && lisse.meilleure === 900, pic + " / " + lisse.meilleure);
    // Distinctions secrètes : chaque secret noté dans drapeaux.secrets donne la sienne ; « Bilingue » demande les deux langues
    const obtenuesAvec = secrets => ev("distinctionsObtenues")({ drapeaux: { secrets }, ateliers: [], aujourdhui: 100, categorieDe: () => "" });
    const tous = ["chercheur", "noctambule", "langue-fr", "langue-en", "sesame", "vendredi-13", "oeil-de-lynx", "cryptographe"];
    const attendues = ["chercheur", "noctambule", "bilingue", "sesame", "vendredi-13", "oeil-de-lynx", "cryptographe"];
    ok("distinctions secrètes : chaque secret trouvé donne sa distinction, et rien sans secret",
      attendues.every(id => obtenuesAvec(tous).includes(id)) && !obtenuesAvec(["langue-fr"]).includes("bilingue") && !attendues.some(id => obtenuesAvec([]).includes(id)),
      obtenuesAvec(tous).join(", "));
    for (let j = 0; j < 450; j++) photo = ev("photographier")(photo, 200 + j, { globale: 10, domaines: {} });
    ok("photographie : 400 jours au plus", Object.keys(photo.jours).length === 400);

    // ---------- Révision espacée (audit A1) ----------
    const L = (m, juste, jour, cert = "sur") => ev("reponseLeitner")(m, juste, cert, jour, [0, 1, 3, 7, 14, 30]);
    let mem = null;
    for (let k = 0; k < 5; k++) mem = L(mem, true, 500).m;
    ok("audit A1 : cinq bonnes réponses le même jour → boîte 1 (et non 5), échéance inchangée", mem.b === 1 && mem.n === 5 && mem.j === 5 && mem.d === 501, JSON.stringify(mem));
    const due = L(mem, true, 501);
    ok("audit A1 : bonne réponse à une révision due → boîte suivante, échéance repoussée", due.due && due.monte && due.m.b === 2 && due.m.d === 504);
    const tot = L({ b: 4, d: 520, n: 6, j: 6 }, true, 505);
    ok("audit A1 : bonne réponse anticipée → ni montée ni nouvelle échéance", !tot.due && !tot.monte && tot.m.b === 4 && tot.m.d === 520 && tot.m.j === 7);
    const faux = L({ b: 4, d: 520, n: 6, j: 6 }, false, 505);
    ok("audit A1 : une erreur, même anticipée, ramène en boîte 1, révision le lendemain", faux.m.b === 1 && faux.m.d === 506);
    ok("audit A1 : « au hasard » juste et due → pas de montée", L({ b: 2, d: 505, n: 3, j: 3 }, true, 505, "hasard").m.b === 2);

    // ---------- Barème et seuils d'étalonnage ----------
    const bascules = bareme => {
      const B = ev(bareme), l = [];
      let prec = null;
      for (let i = 0; i <= 10000; i++) {
        const p = i / 10000;
        const meilleur = ["hasard", "plutot", "sur"].reduce((a, k) => p * B[k][0] + (1 - p) * B[k][1] > p * B[a][0] + (1 - p) * B[a][1] + 1e-12 ? k : a, "hasard");
        if (meilleur !== prec) { l.push([meilleur, p]); prec = meilleur; }
      }
      return l;
    };
    const q = bascules("BAREME_QUIZ"), dl = bascules("BAREME_DUEL");
    ok("barème du quiz : « Plutôt sûr » dès 1/3, « Sûr » dès 3/4", q.length === 3 && Math.abs(q[1][1] - 1 / 3) < 0.001 && Math.abs(q[2][1] - 0.75) < 0.001, JSON.stringify(q));
    ok("barème des duels : « Plutôt sûr » dès 60 %, « Sûr » dès 6/7", dl.length === 3 && Math.abs(dl[1][1] - 0.6) < 0.001 && Math.abs(dl[2][1] - 6 / 7) < 0.001, JSON.stringify(dl));
    ok("barème : ne pas indiquer sa certitude ne rapporte jamais plus que la meilleure déclaration", [0, 0.2, 0.5, 0.8, 1].every(p => {
      const B = ev("BAREME_QUIZ"), v = k => p * B[k][0] + (1 - p) * B[k][1];
      return v("aucune") <= Math.max(v("sur"), v("plutot"), v("hasard")) + 1e-9;
    }));
    ok("barème : le total d'une série n'est jamais négatif", ev("totalSerie")([-8, -8, -8]) === 0 && ev("totalSerie")([10, -8, 4]) === 6);

    // ---------- Plafonds ----------
    const gain = (e, src, v, jour, cle) => ev("appliquerGain")(e, src, v, jour, cle);
    let e = null, p;
    [e, p] = gain(e, "situation-jour", true, 1); const p1 = p;
    [e, p] = gain(e, "situation-jour", true, 1);
    ok("plafond : situation du jour une fois par jour (8 puis 0)", p1 === 8 && p === 0);
    [e, p] = gain(e, "situation-jour", false, 2);
    ok("plafond : de nouveau le lendemain (5)", p === 5);
    let somme = 0;
    for (let k = 0; k < 5; k++) { [e, p] = gain(e, "atelier-note", [10, 10, 3], 3, "monde"); somme += p; }
    ok("plafond : atelier noté, trois parties par jour (3 × 20)", somme === 60, String(somme));
    [e, p] = gain(e, "galton", 15, 4); const g1 = p;
    [e, p] = gain(e, "galton", 15, 4);
    ok("plafond : Planche de Galton, 20 points par jour (20 puis 0)", g1 === 20 && p === 0, g1 + " / " + p);
    const quiz = [];
    for (const total of [45, 50, 30]) { [e, p] = gain(e, "quiz", total, 6, "serie"); quiz.push(p); }
    [e, p] = gain(e, "quiz", 40, 7, "serie"); quiz.push(p);
    ok("quiz : le total de la série est crédité, au plus 100 par jour (45, 50, 5), de nouveau le lendemain (40)", quiz.join() === "45,50,5,40", quiz.join());
    [e, p] = gain(e, "fiche-lue", 0, 5, "biais:ancrage"); const l1 = p;
    [e, p] = gain(e, "fiche-lue", 0, 9, "biais:ancrage");
    ok("plafond : une fiche lue rapporte une seule fois", l1 === 2 && p === 0);
    // Audit A8 : plafonds ajoutés
    const chrono = [];
    for (let k = 0; k < 4; k++) { [e, p] = gain(e, "chrono", 20, 30, "quiz"); chrono.push(p); }
    ok("audit A8 : chrono, trois parties payées par jour (40, 40, 40, 0)", chrono.join() === "40,40,40,0", chrono.join());
    [e, p] = gain(e, "atelier-sans-note", 0, 31, "bingo"); const s1 = p;
    [e, p] = gain(e, "atelier-sans-note", 0, 32, "bingo");
    ok("audit A8 : un atelier sans note ne rapporte qu'une fois (8 puis 0 le lendemain)", s1 === 8 && p === 0);
    ok("audit A8 : durée de lecture minimale, 15 s pour 1 000 caractères", ev("dureeLectureMin")(1000) === 15000 && ev("dureeLectureMin")(0) === 0);
    [e, p] = gain(e, "grand-test", "complet", 10, "complet"); const t1 = p;
    [e, p] = gain(e, "grand-test", "complet", 20, "complet"); const t2 = p;
    [e, p] = gain(e, "grand-test", "complet", 41, "complet");
    ok("plafond : Grand test, une fois par 30 jours (100, 0, puis 100)", t1 === 100 && t2 === 0 && p === 100);
    ok("points : le total ne baisse jamais et le journal garde 50 gains au plus", e.total >= 0 && e.journal.length <= 50);

    // ---------- Jour de repos ----------
    const serie = (jours, auj) => ev("serieAvecRepos")(jours, auj);
    ok("série : sept jours de suite → 7", serie([1, 2, 3, 4, 5, 6, 7], 7) === 7);
    ok("série : un jour manqué dans la semaine ne rompt pas la série", serie([1, 2, 3, 5, 6, 7], 7) === 6);
    // Jours 3 et 5 manqués : le 5 est pardonné, le 3 rompt la série, qui compte 7, 6 et 4
    ok("série : deux jours manqués en sept jours la rompent", serie([1, 2, 4, 6, 7], 7) === 3, String(serie([1, 2, 4, 6, 7], 7)));
    ok("série : hier compte encore aujourd'hui", serie([5, 6], 7) === 2);

    // ---------- Rattrapage ----------
    const d = { memoire: { a: { b: 3, j: 4 } }, resultatsAteliers: { monde: { n: 30 } }, activite: [1, 2], reperages: Array(70).fill({}) };
    const [r1, pr] = ev("rattraper")(null, d, 1);
    const [r2, pr2] = ev("rattraper")(r1, d, 2);
    ok("rattrapage : 6 × 4 + 4 × 3 + 15 + 8 × 20 + 5 × 2 + 5 × 60 = " + pr + ", une seule fois", pr === 24 + 12 + 15 + 160 + 10 + 300 && pr2 === 0 && r2.total === pr);

    // ---------- Distinctions ----------
    const base = { aujourdhui: 100, ateliers, nbFiches: 90, categorieDe: () => "x", drapeaux: {}, compteursLucidite: {}, domaines: {} };
    const obt = x => ev("distinctionsObtenues")(Object.assign({}, base, x));
    ok("distinctions : aucune sans données", obt({}).length === 0, obt({}).join());
    ok("distinctions : Premier doute, Régulier, Bien étalonné, Sans ancre, Sur le terrain", ["premier-doute", "regulier", "bien-etalonne", "sans-ancre", "sur-le-terrain"].every(id => obt({
      memoire: Object.fromEntries(Array.from({ length: 10 }, (_, k) => ["k" + k, { b: 1 }])), activite: [94, 95, 96, 97, 98, 99, 100],
      certitudes: { sur: [40, 36], hasard: [10, 4] }, ancrages: [{ h: 1, b: 1 }, { h: 1.05, b: 1 }, { h: 1, b: 1.02 }], reperages: Array.from({ length: 10 }, (_, k) => ({ cle: "a", j: 90 + (k % 5) }))
    }).includes(id)));
    ok("audit A8 : « Sur le terrain » et « Naturaliste » refusés pour des repérages faits en un seul jour", (() => {
      const l = obt({ reperages: Array.from({ length: 10 }, (_, k) => ({ cle: "c" + k, j: 90 })) });
      return !l.includes("sur-le-terrain") && !l.includes("naturaliste") && obt({ reperages: Array.from({ length: 10 }, (_, k) => ({ cle: "c" + k, j: 90 + (k % 5) })) }).includes("naturaliste");
    })());
    ok("distinctions : les secrètes (emblème, huit illusions)", obt({ drapeaux: { embleme: true, illusions: ["a", "b", "c", "d", "e", "f", "g", "h"] } }).join() === "apparences,demonteur");
    ok("distinctions : une condition qui échoue sur des données inattendues n'arrête rien", Array.isArray(obt({ certitudes: "x", fourchettes: null, previsions: [null] })));

    // ---------- Score face au hasard ----------
    const auMoins = ev("auMoinsAuHasard")(7, 10, 0.25);
    ok("face au hasard : 7 sur 10 ou mieux au hasard (1/4) : 0,35 %", Math.abs(auMoins - 0.003506) < 0.00001, String(auMoins));
    ok("face au hasard : les probabilités de la loi binomiale font 1", Math.abs(ev("binomiale")(10, 0.25).reduce((s, x) => s + x, 0) - 1) < 1e-12);

    // ---------- Joueurs simulés : délais pour atteindre chaque grade ----------
    // Chaque jour : une série de quiz (10 notions) et une ou deux parties d'atelier, au niveau que le joueur tient.
    const simuler = (p, nom) => {
      const alea = ev("generateur")(Math.round(p * 1000));
      const memoire = {}, res = {}, cles = Array.from({ length: 90 }, (_, k) => "f" + k);
      const notes = ateliers.filter(id => MJ[id][1] === "note");
      let meilleure = 0;
      const delais = {};
      for (let jour = 1; jour <= 180; jour++) {
        // Une série de dix notions : les révisions dues d'abord, puis des notions nouvelles (règle de Leitner)
        const dues = cles.filter(c => memoire[c] && memoire[c].d <= jour), nouvelles = cles.filter(c => !memoire[c]);
        [...dues, ...nouvelles].slice(0, 10).forEach(c => { memoire[c] = ev("reponseLeitner")(memoire[c], alea() < p, "sur", jour, [0, 1, 3, 7, 14, 30]).m; });
        for (let k = 0; k < 1 + (jour % 2); k++) {
          const id = notes[Math.floor(alea() * notes.length)], c = MJ[id][2];
          const L = p > 0.85 && jour > 20 ? 3 : p > 0.7 && jour > 10 ? 2 : 1;
          const r = res[id] || { niveaux: {} };
          const n = r.niveaux[L] || { n: 0, sur: 10, historique: [] };
          const reussite = c + (1 - c) * Math.min(1, p * (1.15 - 0.1 * L));
          n.historique = [...n.historique, Math.round(10 * Math.min(1, reussite + (alea() - 0.5) * 0.2))].slice(-12);
          n.n++;
          r.niveaux[L] = n;
          res[id] = r;
        }
        meilleure = Math.max(meilleure, ev("maitrises")({ memoire, resultatsAteliers: res }, ateliers, 90).globale);
        ev("GRADES").forEach(([seuil, g]) => { if (meilleure >= seuil && !delais[g]) delais[g] = jour; });
      }
      lignes.push("INFO  joueur " + nom + " : " + Object.entries(delais).map(([g, j]) => g + " j" + j).join(", ") + " ; maîtrise après 180 jours : " + meilleure);
      return { delais, meilleure };
    };
    const faible = simuler(0.45, "faible"), moyen = simuler(0.7, "moyen"), fort = simuler(0.92, "fort");
    ok("joueurs simulés : Élève dès le premier jour pour le joueur moyen", moyen.delais["Élève"] === 1);
    ok("joueurs simulés : le joueur fort progresse plus haut que le moyen, et le moyen que le faible", fort.meilleure > moyen.meilleure && moyen.meilleure > faible.meilleure, [faible.meilleure, moyen.meilleure, fort.meilleure].join(" < "));
    ok("joueurs simulés : « Esprit critique » hors d'atteinte du joueur moyen en six mois", !moyen.delais["Esprit critique"]);

    // ---------- Intégration : points dans le site, mode sobre ----------
    w.localStorage.clear();
    w.location.reload();
    await new Promise(r => { f.onload = r; });
    await pause(200);
    const d2 = f.contentDocument;
    ok("rattrapage au chargement : clé lucidite créée", !!w.localStorage.getItem("lucidite"));
    const avant = JSON.parse(w.localStorage.getItem("lucidite")).total;
    w.gagner("situation-jour", true);
    ok("gagner() : +8 pour la situation du jour, enregistrés", JSON.parse(w.localStorage.getItem("lucidite")).total === avant + 8);
    ok("bouton de profil visible, avec maîtrise et objectif dans son nom", !d2.querySelector(".bouton-profil").hidden && /maîtrise/.test(d2.querySelector(".bouton-profil").getAttribute("aria-label")));
    w.localStorage.setItem("reglages", JSON.stringify({ sobre: true }));
    w.location.hash = "accueil-sobre"; w.location.hash = "accueil";
    await pause(200);
    w.gagner("vf-jour", true);
    // Mode sobre : le bouton reste (blason seul, sans score ni grade) pour que le profil et ses réglages restent atteignables
    const bp = d2.querySelector(".bouton-profil");
    ok("mode sobre : bouton de profil neutre (sans maîtrise), carte de maîtrise absente, points toujours comptés",
      !bp.hidden && bp.classList.contains("sobre") && !/maîtrise/.test(bp.getAttribute("aria-label")) && !bp.querySelector(".insigne, .anneau-profil")
      && !d2.querySelector(".carte-progression-v2") && JSON.parse(w.localStorage.getItem("lucidite")).total === avant + 13);
    w.localStorage.setItem("reglages", JSON.stringify({}));
    w.location.hash = "profil/ensemble";
    await pause(300);
    ok("page Profil : courbe, toile, barres et calendrier dessinés", d2.querySelectorAll("#vue-profil .graphique").length >= 4);
    // Personnage : une forme non gagnée ou une valeur inconnue (import) retombe sur le premier choix ; gagnée, elle est prise
    const profilAvant = w.localStorage.getItem("profil"), distAvant = w.localStorage.getItem("distinctions");
    w.localStorage.setItem("profil", JSON.stringify({ personnage: { forme: "robot", genre: "inconnu", equipement: "plume" } }));
    w.localStorage.setItem("distinctions", JSON.stringify({ obtenues: [] }));
    const refuse = w.choixPersonnage();
    w.localStorage.setItem("distinctions", JSON.stringify({ obtenues: ["bayesien", "fourchettes"] }));
    const accepte = w.choixPersonnage();
    ok("personnage : choix non gagnés refusés, choix gagnés pris",
      refuse.forme[0] === "humain" && refuse.genre[0] === "neutre" && refuse.equipement[0] === "" && accepte.forme[0] === "robot" && accepte.equipement[0] === "plume");
    w.localStorage.setItem("profil", profilAvant || "{}");
    if (distAvant) w.localStorage.setItem("distinctions", distAvant); else w.localStorage.removeItem("distinctions");

    // ---------- Audit A5 : partie quittée avant la fin ----------
    const resAvant = w.localStorage.getItem("resultatsAteliers");
    w.localStorage.setItem("resultatsAteliers", "{}");
    w.localStorage.setItem("partieEnCours", JSON.stringify({ id: "monde", niveau: 2, debut: w.aujourdHui(), reponses: 3, justes: 3, sur: 10 }));
    const lucA5 = JSON.parse(w.localStorage.getItem("lucidite")).total;
    w.cloreAbandon();
    await pause(50);
    const monde = (JSON.parse(w.localStorage.getItem("resultatsAteliers")).monde || { niveaux: {} }).niveaux[2];
    ok("audit A5 : une partie quittée après trois bonnes réponses compte 3 / 10, sans points, et la clé est effacée",
      !!monde && monde.historique.join() === "3" && monde.sur === 10 && w.localStorage.getItem("partieEnCours") === null && JSON.parse(w.localStorage.getItem("lucidite")).total === lucA5, JSON.stringify(monde));
    w.location.hash = "chiffres/monde";
    await pause(300);
    const choixMonde = d2.querySelector("#vue-chiffres .choix:not(:disabled)");
    if (choixMonde) choixMonde.click();
    await pause(50);
    const enCours = JSON.parse(w.localStorage.getItem("partieEnCours") || "null");
    ok("audit A5 : dès la première réponse, la partie en cours est enregistrée ; l'écran de jeu le dit", !!enCours && enCours.id === "monde" && enCours.reponses === 1
      && /quittée avant la fin|left before the end/.test(d2.querySelector("#vue-chiffres").textContent), JSON.stringify(enCours));
    // Jeux déroulés par derouler() qui corrigent chaque réponse (ici « Qui doit prouver ? ») : même suivi
    w.localStorage.removeItem("partieEnCours");
    w.location.hash = "tests/qui-prouve";
    await pause(300);
    const choixQP = d2.querySelector("#vue-tests .choix:not(:disabled), #vue-tests button.choix");
    if (choixQP) choixQP.click();
    await pause(50);
    const enCoursQP = JSON.parse(w.localStorage.getItem("partieEnCours") || "null");
    ok("audit A5 : « Qui doit prouver ? » (derouler) enregistre aussi la partie en cours", !!enCoursQP && enCoursQP.id === "qui-prouve" && enCoursQP.reponses === 1 && enCoursQP.sur === 10, JSON.stringify(enCoursQP));
    w.localStorage.removeItem("partieEnCours");
    if (resAvant) w.localStorage.setItem("resultatsAteliers", resAvant);

    // ---------- Audit A7 : horloge de l'appareil reculée ----------
    const jourReel = w.jourAppareil();
    w.localStorage.setItem("jourMax", String(jourReel + 3));
    const lucA7 = JSON.parse(w.localStorage.getItem("lucidite")).total;
    const gainRecul = w.gagner("trois-cartes", 0);
    ok("audit A7 : horloge reculée sous le plus grand jour vu → le site reste sur ce jour, aucun gain", w.aujourdHui() === jourReel + 3 && gainRecul === 0 && JSON.parse(w.localStorage.getItem("lucidite")).total === lucA7);
    w.localStorage.setItem("jourMax", String(jourReel + 400));
    ok("audit A7 : un jour vu à plus d'un an en avant est ignoré", w.aujourdHui() === jourReel && JSON.parse(w.localStorage.getItem("jourMax")) === jourReel);

    // ---------- Audit A10 : Noctambule ne récompense plus le jeu nocturne ----------
    const boutonSombre = d2.querySelector('[data-theme-choix="dark"]');
    if (boutonSombre) boutonSombre.click();
    ok("audit A10 : « Noctambule » s'obtient en choisissant le thème sombre", !!boutonSombre && (JSON.parse(w.localStorage.getItem("distinctions")).drapeaux.secrets || []).includes("noctambule"));
    const boutonAuto = d2.querySelector('[data-theme-choix="auto"]');
    if (boutonAuto) boutonAuto.click();

    // ---------- Parcours (parcours.js, lot 5) ----------
    const PARC = ev("PARCOURS");
    const inconnues = [];
    PARC.forEach(p => p.etapes.forEach(e => { try { ev("descriptionEtape")(e, p); } catch (x) { inconnues.push(p.id + " " + e); } }));
    ok("parcours : " + PARC.length + " parcours, toutes leurs fiches et tous leurs ateliers existent", PARC.length === 16 && !inconnues.length, inconnues.join(", "));
    ok("parcours : chacun se termine par le quiz ciblé (Premiers pas : puis la première série)", PARC.every(p => p.etapes.includes("q") && (p.etapes[p.etapes.length - 1] === "q" || p.id === "premiers-pas")));
    // Joueur simulé : chaque étape faite, parcours par parcours
    const fichesParc = [...new Set(PARC.flatMap(p => p.etapes.filter(e => e.startsWith("f:")).map(e => e.slice(2))))];
    const ateliersParc = [...new Set(PARC.flatMap(p => p.etapes.filter(e => e.startsWith("a:")).map(e => e.slice(2))))];
    const dP = { fichesLues: [], resultatsAteliers: {}, memoire: {}, parcours: {} };
    ok("parcours : rien n'est fait d'avance pour un nouveau visiteur", PARC.every(p => ev("avancementParcours")(p, dP) === 0));
    dP.fichesLues = fichesParc;
    ateliersParc.forEach(id => { dP.resultatsAteliers[id] = { n: 1, historique: [] }; });
    dP.memoire = Object.fromEntries(Array.from({ length: 10 }, (_, k) => ["k" + k, { b: 1 }]));
    ok("parcours : une étape déjà faite est validée d'emblée (tout sauf le quiz ciblé)", PARC.every(p => ev("avancementParcours")(p, dP) === p.etapes.length - 1));
    dP.parcours = { quiz: Object.fromEntries(PARC.map(p => [p.id, true])) };
    ok("parcours : de bout en bout, chaque parcours est terminé", PARC.every(p => ev("avancementParcours")(p, dP) === p.etapes.length));
    // Dans le site : pages, points une seule fois, quiz ciblé
    w.localStorage.setItem("fichesLues", JSON.stringify(fichesParc));
    w.localStorage.setItem("resultatsAteliers", JSON.stringify(dP.resultatsAteliers));
    w.localStorage.setItem("memoire", JSON.stringify(dP.memoire));
    w.localStorage.setItem("parcours", JSON.stringify({ actif: "chiffres", quiz: { chiffres: true } }));
    const luc0 = JSON.parse(w.localStorage.getItem("lucidite")).total;
    w.location.hash = "parcours/chiffres";
    await pause(250);
    const luc1 = JSON.parse(w.localStorage.getItem("lucidite")).total;
    const etapesChiffres = PARC.find(p => p.id === "chiffres").etapes.length;
    ok("parcours terminé : conclusion et sceau affichés", !!d2.querySelector(".conclusion-parcours .sceau"));
    ok("parcours terminé : 10 par étape et 50 pour le parcours (" + (10 * etapesChiffres + 50) + ")", luc1 - luc0 === 10 * etapesChiffres + 50, String(luc1 - luc0));
    w.location.hash = "parcours"; await pause(150);
    w.location.hash = "parcours/chiffres"; await pause(250);
    ok("parcours : revenir ne redonne pas de points", JSON.parse(w.localStorage.getItem("lucidite")).total === luc1);
    w.location.hash = "parcours";
    await pause(200);
    ok("page des parcours : seize cartes, chacune avec sa durée", d2.querySelectorAll("#vue-parcours .carte-parcours").length === 16 && [...d2.querySelectorAll("#vue-parcours .carte-parcours .surtitre")].every(e => /environ/.test(e.textContent)));
    ok("parcours : durées estimées entre 15 minutes et 1 h 30", PARC.every(p => { const m = ev("dureeParcours")(p); return m >= 15 && m <= 90; }), PARC.map(p => p.id + " " + ev("dureeParcours")(p)).join(", "));
    w.location.hash = "parcours/premiers-pas/quiz";
    await pause(200);
    for (let k = 0; k < 5; k++) {
      const choix = d2.querySelector("#vue-parcours .choix:not(:disabled)");
      if (choix) choix.click();
      await pause(40);
      const suite = d2.querySelector("#vue-parcours [data-suivant]");
      if (suite) suite.click();
      await pause(40);
    }
    const scoreQuiz = d2.querySelector("#vue-parcours .grand-score");
    ok("quiz ciblé : cinq questions, puis un score sur 5", !!scoreQuiz && / \/ 5$/.test(scoreQuiz.textContent), scoreQuiz ? scoreQuiz.textContent : "aucun score");
    const valide = !!(JSON.parse(w.localStorage.getItem("parcours")).quiz || {})["premiers-pas"];
    ok("quiz ciblé : validé seulement à 4 sur 5", valide === (Number(scoreQuiz.textContent.split(" ")[0]) >= 4));
    w.localStorage.clear();
    w.location.hash = "parcours-vide"; w.location.hash = "accueil";
    await pause(200);
    const bienvenue = d2.querySelector(".carte-bienvenue");
    ok("accueil du nouveau visiteur : quatre écrans (le site, où trouver quoi, comment s'en servir, par où commencer), le troisième fait choisir l'objectif", !!bienvenue && (() => {
      for (let k = 0; k < 2; k++) [...d2.querySelectorAll(".carte-bienvenue button")].find(b => /Suivant/.test(b.textContent)).click();
      const puce = [...d2.querySelectorAll(".carte-bienvenue .puce")].find(b => /100/.test(b.textContent));
      if (!puce) return false;
      puce.click();
      return JSON.parse(w.localStorage.getItem("objectif")) === 100 && /4 sur 4|4 of 4/.test(d2.querySelector(".carte-bienvenue .surtitre").textContent);
    })());
    [...d2.querySelectorAll(".carte-bienvenue button")].find(b => /Passer/.test(b.textContent)).click();
    w.location.hash = "accueil-b"; w.location.hash = "accueil";
    await pause(150);
    ok("accueil du nouveau visiteur : une fois passé, il ne revient pas", !d2.querySelector(".carte-bienvenue") && JSON.parse(w.localStorage.getItem("profil")).accueilFait === true);
    ok("accueil d'un nouveau visiteur : orienté vers « Premiers pas »", [...d2.querySelectorAll("#vue-accueil .appel-action a")].some(a => a.getAttribute("href") === "#parcours/premiers-pas"));
    w.localStorage.setItem("parcours", JSON.stringify({ actif: "hasard" }));
    w.localStorage.setItem("activite", JSON.stringify([1]));
    w.location.hash = "accueil-parc"; w.location.hash = "accueil";
    await pause(200);
    ok("accueil : la prochaine étape du parcours suivi est l'action principale", /Votre parcours/.test(d2.querySelector("#vue-accueil .appel-action .bouton").textContent));
  } catch (e) {
    lignes.push("EXCEPTION " + e.message + "\n" + e.stack);
  }
  ok("aucune erreur JavaScript" + (erreursJS.length ? " : " + erreursJS.join(" | ") : ""), erreursJS.length === 0);
  const echecs = lignes.filter(l => l.startsWith("ÉCHEC") || l.startsWith("EXCEPTION")).length;
  const total = lignes.filter(l => !l.startsWith("INFO")).length;
  lignes.unshift("RÉSUMÉ : " + (total - echecs) + " / " + total + " vérifications réussies");
  document.getElementById("out").textContent = lignes.join("\n");
  lignes.forEach(l => String(l).split("\n").forEach(x => console.log("RAPPORT: " + x)));
  console.log("RAPPORT-FIN");
};
</script>
