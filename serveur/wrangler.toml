# Configuration du Worker (voir README.md). Remplacer database_id par celui que donne « wrangler d1 create ».
name = "esprit-critique-synchro"
main = "worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "BASE"
database_name = "esprit-critique-synchro"
database_id = "5178d7d8-15e4-465d-a837-013b0c5729a3"

# Limitation des créations de coffres : approximative et locale à chaque centre de données (documentation Cloudflare)
[[ratelimits]]
name = "LIMITE_CREATIONS"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Écritures d'un même coffre (clé : son identifiant) : l'application en fait au plus une par minute et par appareil
[[ratelimits]]
name = "LIMITE_ECRITURES"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Purge des coffres inactifs depuis 24 mois, chaque jour à 3 h 17 (UTC)
[triggers]
crons = ["17 3 * * *"]

[vars]
ORIGINES = "https://esprit-critique.github.io"
MAX_COFFRES = "100000"
# Taille de base au-delà de laquelle une écriture qui la ferait grossir est refusée (507) : sous les 500 Mo de l'offre
# gratuite de D1 ; à relever avec l'offre payante (10 Go)
MAX_OCTETS = "450000000"
